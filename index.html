<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orphee & Ashworth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
  background: linear-gradient(135deg, #0b132b, #1a2f55, #0b132b);
  background-size: 400% 400%;
  animation: bgShimmer 10s ease infinite;
  color: #ffd700;
  padding:40px 20px
}

@keyframes bgShimmer {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.logo{
  text-align:center;
  margin-bottom:40px;
  font-size:32px;
  color:#ffd700
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  max-width:900px;
  margin:0 auto
}

.product{
  text-align:center
}

.bottle{
  width:70px;height:100px;margin:0 auto 10px
}

.product-name{
  font-size:13px;margin-bottom:4px;color:#ffd700
}

.product-price{
  font-size:13px;color:#ffd700
}

.btn{
  padding:6px 10px;
  background:#ffd700;
  color:#0b132b;
  border:none;
  font-size:11px;
  cursor:pointer;
  margin:2px
}
</style>
</head>
<body>
<div class="logo">Orphee & Ashworth</div>
<div class="product-grid">

  <div class="product">
    <div class="bottle">🍾</div>

  </div>

  <div class="product">
