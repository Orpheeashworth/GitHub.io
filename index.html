<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orphee ASHWORTH - 都市运动香氛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        :root {
            --bg-main: #0a0a0d;
            --bg-card: #14141a;
            --accent-neon: #ff3a3a;
            --accent-hk: #ff6b00;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a8;
            --border: #2a2a33;
            --glow: 0 0 15px rgba(255, 58, 58, 0.4);
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            background-image: 
                linear-gradient(rgba(10,10,13,0.95), rgba(10,10,13,0.98)),
                url('https://picsum.photos/1920/1080?grayscale&blur=2');
            background-attachment: fixed;
            line-height: 1.5;
            padding-bottom: 120px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(10,10,13,0.95);
            backdrop-filter: blur(8px);
            z-index: 999;
        }
        .logo {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--text-primary);
            text-shadow: var(--glow);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .lang-select {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 0;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-select:hover {
            border-color: var(--accent-neon);
            box-shadow: var(--glow);
        }
        .cart-icon {
            font-size: 24px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }
        .cart-icon:hover {
            transform: scale(1.1);
        }
        #cartCount {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-neon);
            color: var(--text-primary);
            font-size: 11px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
