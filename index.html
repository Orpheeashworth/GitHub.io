<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orphee & Ashworth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;padding:40px 20px}
.logo{text-align:center;margin-bottom:40px;font-size:32px}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:900px;margin:0 auto}
.product{text-align:center}
.bottle{width:70px;height:100px;margin:0 auto 10px}
.product-name{font-size:13px;margin-bottom:4px}
.product-price{font-size:13px;color:#aaa}
.btn{padding:6px 10px;background:#fff;color:#000;border:none;font-size:11px;cursor:pointer;margin:2px}
</style>
</head>
<body>
<div class="logo">Orphee & Ashworth</div>
<div class="product-grid">
  <div class="product">
    <div class="bottle">🍾</div>
    <div class="product-name">午夜木蘭</div>
    <div class="product-price">HK$ 480</div>
    <button class="btn">購物車</button>
  </div>
  <div class="product">
    <div class="bottle">🍾</div>
    <div class="product-name">海風橙花</div>
    <div class="product-price">HK$ 420</div>
    <button class="btn">購物車</button>
  </div>
</div>
</body>
</html>
