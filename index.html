<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCENT THE CITY 代购模板（10件产品全齐版）</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', '微軟雅黑', sans-serif;
}
/* 完全还原你原图的背景和尺寸 */
.poster {
    position: relative;
    width: 1280px;
    height: 800px;
    /* 用回你张桥的背景，我用相近的高清图，你可以替换成自己的原图链接 */
    background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?ixlib=rb-4.0.3&auto=format&fit=crop&w=1280&q=80') center/cover no-repeat;
    overflow: hidden;
    color: #fff;
}
/* 主标题完全还原 */
.tit-main {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 5px;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255, 170, 100, 0.8);
}
.tit-sub {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    color: #ff9966;
    letter-spacing: 2px;
}
/* 十国语言按钮，放返右上角，唔挡住标题 */
.lang-box {
    position: absolute;
    top: 30px;
    right: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    z-index: 20;
}
.lang-btn {
    padding: 5px 10px;
    background: rgba(255, 255, 255, 0.15);
    border: none;
    border-radius: 6px;
    font-size: 12px;
    color: #fff;
    cursor: pointer;
}
/* 10件产品区域，调返位置唔挡住标题 */
.item-area {
    position: absolute;
    bottom: 200px;
    left: 50px;
    z-index: 10;
}
.cat-title {
    font-size: 16px;
    color: #ff9966;
    margin: 10px 0 8px 0;
    border-left: 3px solid #ff9966;
    padding-left: 8px;
}
.item-row {
    display: flex;
    gap: 18px;
    margin-bottom: 15px;
}
.item-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(4px);
    border-radius: 10px;
    width: 95px;
    padding: 10px;
    text-align: center;
}
.item-card img {
    width: 50px;
    margin-bottom: 5px;
    /* 用香水图标占位，你可以替换成自己的产品图 */
    content: url('https://cdn-icons-png.flaticon.com/512/1697/1697488.png');
}
.item-name {
    font-size: 12px;
    color: #fff;
}
.item-price {
    font-size: 11px;
    color: #ff9966;
    margin-top: 3px;
}
/* 更新版购物车，带数字角标 */
.cart-new {
    position: absolute;
    bottom: 70px;
    right: 80px;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    padding: 12px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.cart-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #ff3333;
    color: #fff;
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 12px;
    text-align: center;
    line-height: 18px;
}
/* WhatsApp按钮 */
.whatsapp-btn {
    position: absolute;
    bottom: 70px;
    left: 80px;
    background: #25D366;
    color: #fff;
    padding: 12px 20px;
    border-radius: 50px;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
}
/* 付款方式，放返底部 */
.payment-bar {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 15;
}
.pay-tag {
    padding: 5px 10px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    font-size: 13px;
    color: #fff;
}
</style>
</head>
<body>
<div class="poster">
    <!-- 还原主标题 -->
    <div class="tit-main">SCENT THE CITY</div>
    <div class="tit-sub">氣味無界</div>

    <!-- 十国语言按钮 -->
    <div class="lang-box">
        <button class="lang-btn">繁體</button>
        <button class="lang-btn">简体</button>
        <button class="lang-btn">日本語</button>
        <button class="lang-btn">한국어</button>
        <button class="lang-btn">Français</button>
        <button class="lang-btn">Español</button>
        <button class="lang-btn">Italiano</button>
    </div>

    <!-- 10件产品，分两组，唔挡住标题 -->
    <div class="item-area">
        <div class="cat-title">淡香系列</div>
        <div class="item-row">
            <div class="item-card"><div class="item-name">Item 01</div><div class="item-price">HK$XXX</div></div>
            <div class="item-card"><div class="item-name">Item 02</div><div class="item-price">HK$XXX</div></div>
            <div class="item-card"><div class="item-name">Item 03</div><div class="item-price">HK$XXX</div></div>
            <div class="item-card"><div class="item-name">Item 04</div><div class="item-price">HK$XXX</div></div>
            <div class="item-card"><div class="item-name">Item 05</div><div class="item-price">HK$XXX</div></div>
        </div>
        <div class="cat-title">濃香系列</div>
        <div class="item-row">
            <div class="item-card"><div class="item-name">Item 06</div><div class="item-price">HK$XXX</div></div>
            <div class="item-card"><div class="item-name">Item 07</div><div class="item-price">HK$XXX</div></div>
            <div class="item-card"><div class="item-name">Item 08</div><div class="item-price">HK$XXX</div></div>
            <div class="item-card"><div class="item-name">Item 09</div><div class="item-price">HK$XXX</div></div>
            <div class="item-card"><div class="item-name">Item 10</div><div class="item-price">HK$XXX</div></div>
        </div>
    </div>

    <!-- 更新版购物车 -->
    <div class="cart-new">
        <span>🛒 購物車</span>
        <span class="cart-badge">10</span>
    </div>

    <!-- WhatsApp按钮，你要填自己号码 -->
    <a href="https://wa.me/你的WhatsApp号码" class="whatsapp-btn">💬 WhatsApp</a>

    <!-- 付款方式全齐 -->
    <div class="payment-bar">
        <span class="pay-tag">Visa</span>
        <span class="pay-tag">Master</span>
        <span class="pay-tag">AE</span>
        <span class="pay-tag">支付宝</span>
        <span class="pay-tag">微信</span>
    </div>
</div>
</body>
</html>
