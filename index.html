<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orphee & Ashworth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:serif}
body{background:#fff;color:#222;padding-bottom:60px}
.header{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;border-bottom:1px solid #ddd;position:sticky;top:0;background:#fff;z-index:99}
.logo{font-size:30px;font-weight:600;letter-spacing:1.5px}
.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 14px;border:1px solid #222;background:#fff;border-radius:6px;cursor:pointer}
.btn:hover{background:#222;color:#fff}
.whatsapp{background:#25D366;color:#fff;border-color:#25D366}
.container{max-width:1300px;margin:0 auto;padding:40px 20px}
.title{font-size:28px;text-align:center;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.card{border:1px solid #eee;border-radius:12px;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:0 6px 16px rgba(0,0,0,.06)}
.pic{height:220px;background:#f8f8f8;display:flex;align-items:center;justify-content:center}
.pic img{max-height:85%;max-width:85%}
.info{padding:16px;text-align:center}
.name{margin-bottom:10px;font-size:16px}
.add{width:100%;padding:8px;border:1px solid #222;background:#fff;border-radius:6px;cursor:pointer}
.add:hover{background:#222;color:#fff}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>

<div class="header">
  <div class="logo">Orphee & Ashworth</div>
  <div class="nav">
    <select id="lang" class="btn">
      <option value="hk">繁體中文</option>
      <option value="cn">简体中文</option>
      <option value="en">English</option>
      <option value="jp">日本語</option>
      <option value="kr">한국어</option>
      <option value="it">Italiano</option>
      <option value="fr">Français</option>
    </select>
    <button class="btn" i18n="wish">願望</button>
    <button class="btn" i18n="cart">購物車 (<span id="cart">0</span>)</button>
    <button class="btn" i18n="checkout">收款</button>
    <a href="https://wa.me/85290475370" target="_blank" class="btn whatsapp" i18n="wa">WhatsApp 多謝</a>
  </div>
</div>

<div class="container">
  <h2 class="title" i18n="title">15款精選香水</h2>
  <div class="grid">

<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 01</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 02</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 03</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 04</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 05</div><button class="add">加入購物車</button></div></div>

<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 06</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 07</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 08</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 09</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 10</div><button class="add">加入購物車</button></div></div>

<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 11</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 12</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 13</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 14</div><button class="add">加入購物車</button></div></div>
<div class="card"><div class="pic"><img src="https://cdn-icons-png.flaticon/512/2909/2909838.png"></div><div class="info"><div class="name">Perfume 15</div><button class="add">加入購物車</button></div></div>

  </div>
</div>

<script>
let count = 0;
document.querySelectorAll('.add').forEach(b=>{
  b.onclick=()=>{
    count++;
    document.getElementById('cart').textContent=count;
    alert('已加入購物車');
  }
});

const text={
  hk:{wish:"願望",cart:"購物車",checkout:"收款",wa:"WhatsApp 多謝",title:"15款精選香水"},
  cn:{wish:"愿望",cart:"购物車",checkout:"收款",wa:"WhatsApp 多謝",title:"15款精选香水"},
  en:{wish:"Wishlist",cart:"Cart",checkout:"Checkout",wa:"WhatsApp Us",title:"15 Selected Perfumes"},
  jp:{wish:"お気に入り",cart:"カート",checkout:"お会計",wa:"WhatsApp で連絡",title:"15種の香水"},
  kr:{wish:"위시",cart:"장바구니",checkout:"결제",wa:"WhatsApp 문의",title:"15가지 향수"},
  it:{wish:"Desideri",cart:"Carrello",checkout:"Pagamento",wa:"WhatsApp",title:"15 Profumi"},
  fr:{wish:"Souhaits",cart:"Panier",checkout:"Paiement",wa:"WhatsApp",title:"15 Parfums"}
};

document.getElementById('lang').onchange=e=>{
  const t=text[e.target.value];
  document.querySelectorAll('[i18n]').forEach(el=>{
    if(el.id==='cart'){
      el.innerHTML=count;
      el.closest('.btn').textContent=t.cart+' ('+count+')';
    }else{
      el.textContent=t[el.getAttribute('i18n')];
    }
  });
};
</script>

</body>
</html>
