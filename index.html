<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orphee ASHWORTH - 都市運動香氛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        :root {
            --bg-main: #0a0a0d;
            --bg-card: #14141a;
            --accent-neon: #ff3a3a;
            --accent-hk: #ff6b00;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a8;
            --border: #2a2a33;
            --glow: 0 0 15px rgba(255, 58, 58, 0.4);
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.5;
            padding-bottom: 180px;
        }
        header {
            display:flex;justify-content:space-between;align-items:center;
            padding:18px 30px;border-bottom:1px solid var(--border);
            position:sticky;top:0;background:rgba(10,10,13,0.95);
            backdrop-filter:blur(8px);z-index:999;
        }
        .logo {
            font-size:30px;font-weight:900;text-transform:uppercase;
            color:var(--text-primary);text-shadow:var(--glow);
        }
        .header-right{display:flex;align-items:center;gap:25px;}
        .lang-select{background:var(--bg-card);color:#fff;border:1px solid var(--border);padding:6px 12px;cursor:pointer;}
        .cart-icon{font-size:24px;position:relative;cursor:pointer;}
        #cartCount{position:absolute;top:-8px;right:-8px;background:var(--accent-neon);
            width:18px;height:18px;border-radius:500px;display:flex;align-items:center;justify-content:center;font-size:11px;}
        .category-nav{display:flex;justify-content:center;gap:20px;padding:20px;
            border-bottom:1px solid var(--border);flex-wrap:wrap;background:#111;}
        .category-nav a{color:var(--text-secondary);text-decoration:none;padding:4px 8px;
            text-transform:uppercase;font-weight:700;font-size:15px;}
        .category-nav a.active,.category-nav a:hover{color:var(--accent-neon);}
        .hero{width:100%;height:70vh;background:linear-gradient(#0007,#000c),url(https://space.coze.cn/s/09I69YOHDqw/);
            background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center;}
        .hero h1{font-size:7vw;text-transform:uppercase;font-weight:900;margin-bottom:15px;}
        .hero p{color:var(--accent-hk);text-transform:uppercase;letter-spacing:3px;}
        .container{max-width:1400px;margin:60px auto;padding:0 30px;}
        .section-title{font-size:28px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:30px;}
        .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px;}
        .product{background:var(--bg-card);border:1px solid var(--border);overflow:hidden;border-radius:6px;transition:all .3s;}
        .product:hover{transform:translateY(-6px);border-color:var(--accent-neon);}
        .product-img{width:100%;height:320px;object-fit:cover;}
        .product-info{padding:18px;}
        .product-name{font-size:16px;font-weight:700;text-transform:uppercase;margin-bottom:8px;}
        .price{font-size:20px;color:var(--accent-neon);font-weight:900;margin:12px 0;}
        .add-cart{width:100%;padding:10px;background:transparent;border:1px solid var(--accent-neon);color:#fff;text-transform:uppercase;cursor:pointer;}
        .add-cart:hover{background:var(--accent-neon);color:#000;}
        /* 付款图标区 */
        .pay-area{text-align:center;margin:40px 0;padding:0 20px;}
        .pay-area h3{margin-bottom:20px;color:var(--text-secondary);text-transform:uppercase;}
        .pay-icons{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;align-items:center;}
        .pay-icons img{height:45px;}
        .cart-bar{position:fixed;bottom:0;left:0;right:0;background:#14141a;border-top:1px solid var(--border);
            padding:15px 25px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;}
        .whatsapp-btn{background:#25D366;color:#fff;border:none;padding:10px 18px;font-weight:bold;cursor:pointer;}
        .contact{text-align:center;padding:40px 20px;color:var(--text-secondary);border-top:1px solid var(--border);margin-top:50px;}
    </style>
</head>
<body>

<header>
    <div class="logo">orphee ASHWORTH</div>
    <div class="header-right">
        <select class="lang-select" id="langSelect">
            <option value="zh-HK" selected>繁體</option>
            <option value="zh-CN">简体</option>
            <option value="en">English</option>
        </select>
        <div class="cart-icon">🛒 <span id="cartCount">0</span></div>
    </div>
</header>

<!-- 五大分类齐全 -->
<nav class="category-nav">
    <a href="#" class="active" data-cat="street" data-i18n="cat_street">街頭</a>
    <a href="#" data-cat="sport" data-i18n="cat_sport">運動</a>
    <a href="#" data-cat="wood" data-i18n="cat_wood">木質調</a>
    <a href="#" data-cat="smoke" data-i18n="cat_smoke">煙燻調</a>
    <a href="#" data-cat="limited" data-i18n="cat_limited">限定款</a>
    <a href="#" data-cat="all" data-i18n="cat_all">全部</a>
</nav>

<section class="hero">
    <div class="hero-text">
        <h1>SCENT THE CITY</h1>
        <p>URBAN SCENT, NO RULES</p>
    </div>
</section>

<div class="container">
    <h2 class="section-title" data-i18n="page_title">精選香氛系列</h2>
    <div class="products" id="productsList"></div>
</div>

<!-- 全付款方式：Visa/Master/AE/支付宝/微信/八达通 -->
<div class="pay-area">
    <h3 data-i18n="pay_title">支持付款方式</h3>
    <div class="pay-icons">
        <img src="https://img.icons8.com/fluency/96/000000/visa.png" alt="Visa">
        <img src="https://img.icons8.com/fluency/96/000000/mastercard.png" alt="Mastercard">
        <img src="https://img.icons8.com/fluency/96/000000/american-express.png" alt="AE运通">
        <img src="https://img.icons8.com/fluency/96/000000/alipay.png" alt="支付宝">
        <img src="https://img.icons8.com/fluency/96/000000/wechat-pay.png" alt="微信">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968298.png" alt="八达通">
    </div>
</div>

<div class="cart-bar">
    <div class="cart-total" data-i18n="cart_total">總金額：HK$<span id="totalPrice">0</span></div>
    <button class="whatsapp-btn" onclick="sendWhatsAppOrder()" data-i18n="btn_wa">WhatsApp落單付款</button>
</div>

<div class="contact">
    <p>WhatsApp：<a href="https://wa.me/85290475370" target="_blank">+852 9047 5370</a></p>
    <p>Email：Orphee.ashworth1@gmail.com</p>
</div>

<script>
// ===================== 加多超多新产品 16款齐上架 =====================
const products = [
    // 1.街頭系列
    {id:1,name:"STREET PUNK REBEL",price:539,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"street"},
    {id:2,name:"DARK ALLEY NIGHT",price:519,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"street"},
    {id:3,name:"NEON CITY VIBE",price:549,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"street"},
    {id:4,name:"URBAN RAW SCENT",price:529,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"street"},

    // 2.運動系列
    {id:5,name:"RUNNER FRESH BOOST",price:489,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"sport"},
    {id:6,name:"GYM ENERGY MIST",price:469,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"sport"},
    {id:7,name:"BOXING SWEET DRY",price:559,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"sport"},
    {id:8,name:"OUTDOOR WILD AIR",price:479,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"sport"},

    // 3.木質調系列
    {id:9,name:"CONCRETE WOOD BASE",price:569,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"wood"},
    {id:10,name:"VINTAGE SANDALWOOD",price:579,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"wood"},
    {id:11,name:"CEDAR STREET WOOD",price:559,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"wood"},

    // 4.煙燻調系列
    {id:12,name:"TOBACCO SMOKE DARK",price:589,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"smoke"},
    {id:13,name:"INDUSTRIAL ASH SCENT",price:549,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"smoke"},

    // 5.香港限定款
    {id:14,name:"HK URBAN LIMITED",price:629,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"limited"},
    {id:15,name:"SEASONAL DROP 2026",price:619,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"limited"},
    {id:16,name:"CITY NIGHT EXCLUSIVE",price:639,img:"https://space.coze.cn/s/09I69YOHDqw/",cat:"limited"}
];

let cart = [];
let nowCat = "street";
const pList = document.getElementById("productsList");
const cartNum = document.getElementById("cartCount");
const totalPrice = document.getElementById("totalPrice");
const catLinks = document.querySelectorAll(".category-nav a");

// 渲染产品
function render(){
    pList.innerHTML="";
    let arr = nowCat==="all"?products:products.filter(x=>x.cat===nowCat);
    arr.forEach(p=>{
        let d=document.createElement("div");
        d.className="product";
        d.innerHTML=`
        <img src="${p.img}" class="product-img">
        <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="price">$${p.price}</div>
            <button class="add-cart" onclick="addCart(${p.id})" data-i18n="btn_add">加入購物車</button>
        </div>`;
        pList.appendChild(d);
    });
    updateLang();
}
window.addCart=function(id){
    cart.push(products.find(x=>x.id===id));
    refreshCart();
};
function refreshCart(){
    cartNum.innerText=cart.length;
    let sum=cart.reduce((a,b)=>a+b.price,0);
    totalPrice.innerText=sum;
}

// 分类切换
catLinks.forEach(a=>a.onclick=function(e){
    e.preventDefault();catLinks.forEach(x=>x.classList.remove("active"));
    this.classList.add("active");nowCat=this.dataset.cat;render();
});

// WhatsApp繁体不乱码订单
window.sendWhatsAppOrder=function(){
    if(cart.length===0){alert("購物車未有貨品，請先加購！");return;}
    let msg="📦客戶落單訂單：\n";
    cart.forEach((it,i)=>msg+=`${i+1}.${it.name} | HK$${it.price}\n`);
    let sum=cart.reduce((s,x)=>s+x.price,0);
    msg+=`——————————\n總件數：${cart.length}件\n總金額：HK$${sum}\n請回覆確認收款🙏`;
    window.open(`https://wa.me/85290475370?text=${encodeURIComponent(msg)}`,"_blank");
};

// 多语言字典
const langMap={
"zh-HK":{btn_add:"加入購物車",cart_total:"總金額：HK$",btn_wa:"WhatsApp落單付款",pay_title:"支持付款方式",
cat_street:"街頭",cat_sport:"運動",cat_wood:"木質調",cat_smoke:"煙燻調",cat_limited:"限定款",cat_all:"全部",page_title:"精選香氛系列"},
"zh-CN":{btn_add:"加入购物车",cart_total:"总金额：HK$",btn_wa:"WhatsApp下单付款",pay_title:"支持付款方式",
cat_street:"街头",cat_sport:"运动",cat_wood:"木质调",cat_smoke:"烟熏调",cat_limited:"限定款",cat_all:"全部",page_title:"精选香氛系列"},
"en":{btn_add:"Add To Cart",cart_total:"Total：HK$",btn_wa:"WhatsApp Order",pay_title:"Payment Methods",
cat_street:"Street",cat_sport:"Sport",cat_wood:"Wood",cat_smoke:"Smoke",cat_limited:"Limited",cat_all:"All",page_title:"Scent Collection"}
};
function updateLang(){
    let l=document.getElementById("langSelect").value;
    document.querySelectorAll("[data-i18n]").forEach(el=>{
        let k=el.dataset.i18n;if(langMap[l][k])el.innerText=langMap[l][k];
    });
}
document.getElementById("langSelect").onchange=updateLang;

// 初始化
render();refreshCart();updateLang();
</script>

</body>
</html>
