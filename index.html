<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>orphee ashworth - 香港香氛選物店</title>
<style>
* {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
:root {
    --bg-main: #0a0a0d;
    --bg-card: #14141a;
    --accent-neon: #ff3a3a;
    --accent-hk: #ff6b00;
    --text-primary: #f0f0f0;
    --border: #2a2a33;
    --glow: 0 0 15px rgba(255, 58, 58, 0.4);
}
body {
    /* 返埋舊版暗花紋理底 */
    background: #0a0a0d url("https://www.transparenttextures.com/patterns/dark-wood.png") repeat;
    color: var(--text-primary);
    line-height: 1.5;
    padding-bottom: 120px;
}

/* ========== 你要嘅：頭版Video流光大飛條動畫 ========== */
.hero {
    width: 100%;
    height: 80vh;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
/* 全屏影片背景 */
.hero-video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    transform: translate(-50%, -50%);
    z-index: 1;
    opacity: 0.75;
}
/* 流光飛條動畫層 */
.hero::before {
    content: "";
    position: absolute;
    top: 0;left:0;width:100%;height:100%;
    z-index: 2;
    background: linear-gradient(105deg, transparent 30%, rgba(255,58,58,0.15) 50%, transparent 70%);
    animation: streamLight 6s infinite linear;
}
@keyframes streamLight {
    0%{transform: translateX(-120%) skewX(-20deg);}
    100%{transform: translateX(120%) skewX(-20deg);}
}
.hero::after {
    content: '';
    position: absolute;
    bottom: 0;left:0;right:0;height:30%;
    background: linear-gradient(transparent, var(--bg-main));
    z-index: 3;
}
.hero-text {position:relative;z-index:4;}
.hero h1 {
    font-size:7vw;font-weight:900;text-transform:uppercase;letter-spacing:-3px;
    margin-bottom:15px;text-shadow:0 0 20px rgba(255,107,0,0.6);
}
.hero p {font-size:1.8vw;text-transform:uppercase;letter-spacing:4px;color:var(--accent-hk);}

/* 其餘導航、按鈕、產品、購物車樣式還原舊版靚款 */
header {
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 30px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:rgba(10,10,13,0.95);backdrop-filter:blur(8px);z-index:999;
}
.logo {font-size:3.5rem;font-weight:900;text-transform:uppercase;color:var(--text-primary);text-shadow:var(--glow);}
.header-right {display:flex;align-items:center;gap:25px;}
.lang-select {background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);padding:8px 16px;}
.cart-icon {font-size:2.5rem;cursor:pointer;position:relative;}
#cartCount {
    position:absolute;top:-8px;right:-8px;background:var(--accent-neon);
    color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
.filter-wrap {max-width:1400px;margin:30px auto 0;padding:0 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;justify-items:center;}
.filter-btn {
    padding:16px 32px;background:transparent;border:2px solid var(--accent-neon);
    color:var(--text-primary);text-transform:uppercase;cursor:pointer;font-weight:800;
}
.filter-btn.active {background:var(--accent-neon);color:#000;box-shadow:var(--glow);}
.container {max-width:1400px;margin:40px auto;padding:0 30px;}
.section-title {font-size:3rem;font-weight:900;text-transform:uppercase;margin-bottom:30px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.products {display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:35px;}
.product {background:var(--bg-card);border:1px solid var(--border);transition:all .4s ease;overflow:hidden;}
.product:hover {transform:translateY(-8px);box-shadow:0 10px 30px rgba(255,58,58,0.2);}
.product-img {width:100%;height:350px;object-fit:cover;background:#1a1a1a;}
.product-info {padding:20px;}
.product-name {font-size:1.5rem;font-weight:700;text-transform:uppercase;margin-bottom:15px;}
.price {font-size:2rem;font-weight:900;color:var(--accent-neon);margin-bottom:10px;}
.coupon {color:var(--accent-hk);margin-bottom:20px;font-weight:600;}
.add-cart {width:100%;padding:15px;background:transparent;border:2px solid var(--accent-neon);color:var(--text-primary);font-weight:900;text-transform:uppercase;cursor:pointer;}
.add-cart:hover {background:var(--accent-neon);color:var(--bg-main);box-shadow:var(--glow);}
.cart-bar {position:fixed;bottom:0;left:0;right:0;background:rgba(20,20,26,0.95);border-top:1px solid var(--border);padding:18px 30px;display:flex;justify-content:space-between;align-items:center;}
.cart-total {font-size:1.8rem;font-weight:900;text-transform:uppercase;}
.checkout-btn {padding:15px 40px;background:linear-gradient(90deg,var(--accent-neon),var(--accent-hk));border:none;color:#fff;font-weight:900;cursor:pointer;}
</style>
</head>
<body>
<header>
<div class="logo">orphee ashworth</div>
<div class="header-right">
<select class="lang-select" id="langSelect">
<option value="zh-HK" selected>繁體</option>
</select>
<div class="cart-icon">🛒 <span id="cartCount">0</span></div>
</div>
</header>

<!-- 你要嘅：Video影片背景 + 流光飛條動畫，幾秒自動識郁 -->
<section class="hero">
<video class="hero-video" autoplay muted loop playsinline>
<source src="https://assets.mixkit.co/videos/preview/mixkit-neon-lights-abstract-flow-2237-large.mp4" type="video/mp4">
</video>
<div class="hero-text">
<h1>SCENT THE CITY</h1>
<p>香港香氛選物店，嚴選全球靚貨</p>
</div>
</section>

<div class="filter-wrap">
<button class="filter-btn active" data-filter="all">全部產品</button>
<button class="filter-btn" data-filter="street">街頭廢土調</button>
<button class="filter-btn" data-filter="plant">植物清香調</button>
</div>

<div class="container">
<h2 class="section-title">香水系列</h2>
<div class="products" id="productsList"></div>
</div>

<div class="cart-bar">
<div class="cart-total">總金額: HKD $<span id="totalPrice">0</span></div>
<button class="checkout-btn" onclick="sendWhatsAppOrder()">立即結賬</button>
</div>

<script>
// 內置：Orpheus + Hermès 雙新Item + 穩定相 + coupon
const products = [
    {id:26,name:"Orpheus 限定暗調香氛",price:899,img:"https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=500",cat:"plant",coupon:"限定優惠码:ORP28"},
    {id:27,name:"HERMÈS 愛馬仕奇跡之水禮盒",price:999,img:"https://images.unsplash.com/photo-1556228720-195a672e8a03?w=500",cat:"plant",coupon:"VIP碼:HERMES20"}
];

let cart = [];
const pList = document.getElementById("productsList");
const cartNum = document.getElementById("cartCount");
const priceAll = document.getElementById("totalPrice");

// 渲染產品
function render(){
    pList.innerHTML="";
    products.forEach(x=>{
        pList.innerHTML+=`
        <div class="product">
            <img src="${x.img}" class="product-img">
            <div class="product-info">
                <div class="product-name">${x.name}</div>
                <div class="price">$${x.price}</div>
                <div class="coupon">${x.coupon}</div>
                <button class="add-cart" onclick="addC(${x.id})">加入購物車</button>
            </div>
        </div>
        `;
    });
}

// ✅ 修實購物車！一撳即刻更新數字同金額，唔再唔郁
window.addC = function(id){
    let find = products.find(i=>i.id===id);
    cart.push(find);
    cartNum.innerText = cart.length;
    let sum = cart.reduce((a,b)=>a+b.price,0);
    priceAll.innerText = sum;
}

// WhatsApp落單
window.sendWhatsAppOrder=function(){
    if(cart.length===0){alert("購物車空㗎！");return;}
    let msg="落單:\n";
    cart.forEach((o,k)=>msg+=`${k+1}.${o.name} $${o.price} | ${o.coupon}\n`);
    window.open("https://wa.me/85291257354?text="+encodeURIComponent(msg));
}

// 初始化即刻出晒所有嘢 + 動畫自動循環幾秒變
render();
</script>
</body>
</html>
