<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>Orphee & Ashworth</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      background:#0b1d3a url('https://www.transparenttextures.com/patterns/stardust.png');
      color:#d4af37; font-family:'Playfair Display', serif; margin:0;
      animation:stars 20s linear infinite;
    }
    @keyframes stars {
      from { background-position:0 0; }
      to { background-position:1000px 1000px; }
    }
    header {
      text-align:center; padding:40px;
      background:linear-gradient(135deg,#0b1d3a,#001f3f);
      animation:bgFade 6s infinite alternate;
    }
    @keyframes bgFade {
      0% { background:linear-gradient(135deg,#0b1d3a,#001f3f); }
      100% { background:linear-gradient(135deg,#001f3f,#0b1d3a); }
    }
    h1 { font-size:50px; color:#ffd700; animation:fadeIn 3s ease-in-out forwards; }
    @keyframes fadeIn { from {opacity:0; transform:scale(0.8);} to {opacity:1; transform:scale(1);} }
    .products { display:grid; grid-template-columns:repeat(5,1fr); gap:20px; padding:20px; }
    .product {
      background:#fff; color:#0b1d3a; border:1px solid #d4af37; border-radius:10px;
      padding:15px; text-align:center; opacity:0; animation:slideUp 1s forwards;
    }
    @keyframes slideUp { from {transform:translateY(50px); opacity:0;} to {transform:translateY(0); opacity:1;} }
    .product:hover { transform:scale(1.05); box-shadow:0 0 15px #ffd700; }
    .product img { width:100%; border-radius:8px; cursor:pointer; transition:0.3s; }
    .product img:hover { transform:scale(1.1); }
    .btn { background:#fff; border:2px solid #d4af37; color:#0b1d3a; padding:8px 15px; border-radius:5px; cursor:pointer; transition:0.3s; }
    .btn:hover { background:linear-gradient(90deg,#d4af37,#ffd700); color:#fff; box-shadow:0 0 10px #ffd700; }
    .cart { position:fixed; top:20px; right:20px; background:#fff; color:#0b1d3a; padding:10px; border:1px solid #d4af37; border-radius:5px; cursor:pointer; }
    .whatsapp { position:fixed; bottom:20px; right:20px; background:#25D366; color:#fff; padding:12px 18px; text-decoration:none; border-radius:50px; font-weight:bold; }
    .payment { text-align:center; margin:30px; }
    .payment img { height:40px; margin:0 10px; }
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); }
    .modal-content { background:#fff; margin:10% auto; padding:20px; width:300px; border-radius:10px; color:#0b1d3a; animation:modalFade 0.5s ease-in-out; }
    @keyframes modalFade { from {opacity:0; transform:translateY(-20px);} to {opacity:1; transform:translateY(0);} }
  </style>
</head>
<body>
  <header>
    <h1 id="brand">Orphee & Ashworth</h1>
    <p id="companyDesc">融合文化與歐洲美學，打造獨特香水</p>
  </header>

  <nav style="text-align:center; margin:20px;">
    <label>語言選擇：</label>
    <select onchange="changeLanguage(this.value)">
      <option value="zh-HK">繁體中文</option>
      <option value="zh-CN">简体中文</option>
      <option value="en">English</option>
      <option value="lang-fr]{display:block}
    </select>
  </nav>

  <div class="products">
    <div class="product" onclick="showInfo('Hot Water Scent','HK$880','玫瑰、茉莉、檀香')">
      <img src="https://images.unsplash.com/photo-1585386959984-3f8c3a2f9f3a" alt="Hot Water Scent">
      <h3>Hot Water Scent</h3>
      <button class="btn">立即購買</button>
    </div>
    <div class="product" onclick="showInfo('Astingiray','HK$920','柑橘、麝香、雪松')">
      <img src="https://images.unsplash.com/photo-1526045612212-70caf35c14df" alt="Astingiray">
      <h3>Astingiray</h3>
      <button class="btn">立即購買</button>
    </div>
    <!-- 其餘八件產品同樣結構 -->
  </div>

  <div class="cart" onclick="showCart()">購物車：<span id="cartItems">0</span></div>
  <a class="whatsapp" href="https://wa.me/85290475370" target="_blank">WhatsApp</a>

  <div class="payment">
    <p id="paymentText">接受付款方式：</p>
    <img src="https://upload.wikimedia.org/wikipedia/commons/4/41/Visa_Logo.png" alt="Visa">
    <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/Mastercard-logo.png" alt="MasterCard">
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal">
  </div>

  <!-- 詳情彈窗 -->
  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span onclick="closeModal()" style="cursor:pointer; float:right;">✖</span>
      <h2 id="perfumeName"></h2>
      <p id="perfumePrice"></p>
      <p id="perfumeIngredients"></p>
      <button class="btn" onclick="addToCart(document.getElementById('perfumeName').innerText)">加入購物車</button>
    </div>
  </div>

  <!-- 購物車彈窗 -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <span onclick="closeCart()" style="cursor:pointer; float:right;">✖</span>
      <h3 id="cartTitle">購物車內容</h3>
      <ul id="cartList"></ul>
    </div>
  </div>

<script>
  let cartCount = 0, cartItems = [];

  function showInfo(name, price, ingredients) {
    document.getElementById('perfumeName').innerText = name;
    document.getElementById('perfumePrice').innerText = "價錢：" + price;
    document.getElementById('perfumeIngredients').innerText = "成分：" + ingredients;
    document.getElementById('infoModal').style.display = "block";
  }
  function closeModal() { document.getElementById('infoModal').style.display = "none"; }

  function addToCart(item) {
    cartCount++;
    cartItems.push(item);
    document.getElementById('cartItems').innerText = cartCount;
  }
  function showCart() {
    let list = document.getElementById('cartList');
    list.innerHTML = "";
    cartItems.forEach(product => {
      let li = document.createElement('li');
      li.textContent = product;
