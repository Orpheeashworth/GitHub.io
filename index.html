<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orphée & Ashworth</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  background: #000;
  color: #fff;
  font-family: "Georgia", serif;
  min-height: 100vh;
  background-image: url('https://p9-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc_gen_image/0c677e09500940a0ad218694f4ff6e79.jpeg~tplv-a9rns2rl98-image_dld_watermark_1_6.png');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
/* 你嘅圓形Logo（正確版本） */
.logo {
  width: 300px;
  display: block;
  margin: 40px auto 20px;
}
.shop-now {
  text-align: center;
  margin: 30px 0;
}
.shop-btn {
  background: linear-gradient(135deg, #ffd700, #ffed4e);
  color: #900;
  border: none;
  padding: 18px 60px;
  border-radius: 50px;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(255,215,0,0.6);
}
.footer {
  text-align: center;
  margin: 40px 0;
  color: #ddd;
  font-size: 16px;
}
.payment-icons {
  margin-top: 10px;
  font-size: 20px;
}
</style>
</head>
<body>
  <!-- 你嘅正確Logo -->
  <img class="logo" src="https://p26-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc_gen_image/5e064c0e58744143b40fc3002f328871.jpeg" alt="Orphée & Ashworth Logo">

  <!-- Shop Now 按鈕 -->
  <div class="shop-now">
    <button class="shop-btn" onclick="window.location.href='https://wa.me/85290475370'">Shop Now</button>
  </div>

  <!-- 底部地址 -->
  <div class="footer">
    <p>Address: Whatshop, Ying Kok, Kowloon, Hong Kong</p>
    <div class="payment-icons">
      💳 📲 💵
    </div>
  </div>
</body>
</html>
