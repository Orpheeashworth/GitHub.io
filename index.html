<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orphee ASHWORTH - 都市运动香氛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        :root {
            --bg-main: #0a0a0d;
            --bg-card: #14141a;
            --accent-neon: #ff3a3a;
            --accent-hk: #ff6b00;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a8;
            --border: #2a2a33;
            --glow: 0 0 15px rgba(255, 58, 58, 0.4);
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            background-image:
            linear-gradient(rgba(10,10,13,0.95), rgba(10,10,13,0.98)),
            url('https://picsum.photos/1920/1080?grayscale&blur=2');
            background-attachment: fixed;
            line-height: 1.5;
            padding-bottom: 140px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top:  ...0;
            background: rgba(10,10,13,0.95);
            backdrop-filter: blur(8px);
            z-index: 999;
        }
        .logo {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--text-primary);
            text-shadow: var(--glow);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .lang-select {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 0;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-select:hover {
            border-color: var(--accent-neon);
            box-shadow: var(--glow);
        }
        .cart-icon {
            font-size: 24px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }
        .cart-icon:hover {
            transform: scale(1.1);
        }
        #cartCount {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-neon);
            color: var(--text-primary);
            font-size: 11px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: var(--glow);
        }
        .category-nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,13,0.9);
            backdrop-filter: blur(8px);
            flex-wrap: wrap;
        }
        .category-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            padding: 4px 8px;
        }
        .category-nav a.active, .category-nav a:hover {
            color: var(--accent-neon);
            text-shadow: var(--glow);
        }
        .hero {
            width: 100%;
            height: 80vh;
            background:
            linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
            url('https://picsum.photos/1920/1080?grayscale');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(transparent, var(--bg-main));
        }
        .hero-text {z-index:2;}
        .hero h1 {
            font-size:7vw;font-weight:900;text-transform:uppercase;
            letter-spacing:-3px;margin-bottom:15px;line-height:1;
            text-shadow:0 0 20px rgba(255, 107, 0, 0.6);
        }
        .hero p {
            font-size:1.8vw;text-transform:uppercase;letter-spacing:4px;
            opacity:0.9;color:var(--accent-hk);
        }
        .container {max-width:1400px;margin:70px auto;padding:0 30px;}
        .section-title {
            font-size:32px;font-weight:900;text-transform:uppercase;
            margin-bottom:40px;border-bottom:1px solid var(--border);
            padding-bottom:12px;letter-spacing:1px;
        }
        .products {display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:35px;}
        .product {
            background:var(--bg-card);border:1px solid var(--border);
            transition:all 0.4s ease;overflow:hidden;position:relative;
        }
        .product::before {
            content:'';position:absolute;top:0;left:0;right:0;height:3px;
            background:linear-gradient(90deg,var(--accent-neon),var(--accent-hk));
            transform:scaleX(0);transition:transform 0.4s;
        }
        .product:hover::before{transform:scaleX(1);}
        .product:hover{transform:translateY(-8px);border-color:var(--accent-neon);box-shadow:0 10px 30px rgba(255,58,58,0.2);}
        .product-img {width:100%;height:350px;object-fit:cover;background:#1a1a1a;filter:grayscale(30%) contrast(1.2);transition:filter 0.4s;}
        .product:hover .product-img{filter:grayscale(0%) contrast(1.1);}
        .product-info{padding:20px;}
        .product-name{font-size:17px;font-weight:700;text-transform:uppercase;margin-bottom:10px;letter-spacing:0.8px;}
        .price{font-size:20px;font-weight:900;color:var(--accent-neon);margin-bottom:15px;}
        .add-cart {
            width:100%;padding:12px;background:transparent;color:var(--text-primary);
            border:1px solid var(--accent-neon);font-weight:900;text-transform:uppercase;
            font-size:12px;letter-spacing:1.5px;cursor:pointer;transition:all 0.3s;
        }
        .add-cart:hover{background:var(--accent-neon);color:var(--bg-main);box-shadow:var(--glow);}
        .cart-bar {
            position:fixed;bottom:0;left:0;right:0;background:rgba(20,20,26,0.95);
            backdrop-filter:blur(8px);border-top:1px solid var(--border);
            padding:18px 30px;display:flex;justify-content:space-between;align-items:center;z-index:998;gap:20px;flex-wrap:wrap;
        }
        .cart-total{font-size:20px;font-weight:900;text-transform:uppercase;}
        .checkout-btn,.whatsapp-pay-btn {
            padding:12px 20px;border:none;font-weight:900;text-transform:uppercase;
            cursor:pointer;transition:all 0.3s;font-size:13px;
        }
        .checkout-btn {
            background:linear-gradient(90deg,var(--accent-neon),var(--accent-hk));
            color:var(--text-primary);box-shadow:var(--glow);
        }
        .whatsapp-pay-btn{
            background:#25D366;color:#fff;
        }
        .checkout-btn:hover,.whatsapp-pay-btn:hover{transform:scale(1.05);}
        .contact {
            max-width:1400px;margin:70px auto 0;padding:0 30px 50px;border-top:1px solid var(--border);
            padding-top:50px;text-align:center;color:var(--text-secondary);font-size:15px;
        }
        .contact a{color:var(--accent-hk);text-decoration:none;font-weight:700;transition:all 0.3s;}
        .contact a:hover{color:var(--accent-neon);text-shadow:var(--glow);}
        @media(max-width:768px){
            .hero h1{font-size:12vw;}
            .hero p{font-size:4vw;}
            .products{grid-template-columns:repeat(2,1fr);gap:20px;}
            header{padding:15px 20px;}
            .category-nav{gap:10px;padding:15px 10px;}
            .cart-bar{padding:15px;justify-content:center;}
        }
    </style>
</head>
<body>

<header>
    <div class="logo">orphee ASHWORTH</div>
    <div class="header-right">
        <select class="lang-select" id="langSelect">
            <option value="zh-HK">繁體</option>
            <option value="zh-CN">简体</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
        </select>
        <div class="cart-icon">🛒 <span id="cartCount">0</span></div>
    </div>
</header>

<!-- 新增超多Item分类：街头/运动/木质/烟熏/限定/全部 -->
<nav class="category-nav">
    <a href="#" class="active" data-cat="street">街頭</a>
    <a href="#" data-cat="sport">運動</a>
    <a href="#" data-cat="wood">木質調</a>
    <a href="#" data-cat="smoke">煙燻調</a>
    <a href="#" data-cat="limited">限定款</a>
    <a href="#" data-cat="all">全部</a>
</nav>

<section class="hero">
    <div class="hero-text">
        <h1>SCENT THE CITY</h1>
        <p>URBAN SCENT, NO RULES</p>
    </div>
</section>

<div class="container">
    <h2 class="section-title">精选香氛系列</h2>
    <div class="products" id="productsList"></div>
</div>

<!-- 购物车+WhatsApp付款按钮合体 -->
<div class="cart-bar">
    <div class="cart-total">
        總數:<span id="cartCountText">0</span> &nbsp; 金額:HKD$<span id="totalPrice">0</span>
    </div>
    <div style="display:flex;gap:15px;flex-wrap:wrap;">
        <button class="checkout-btn">查看購物車</button>
        <!-- 核心：WhatsApp一键联络付款，自动带订单内容 -->
        <button class="whatsapp-pay-btn" onclick="sendOrderToWhatsApp()">WhatsApp聯絡付款</button>
    </div>
</div>

<div class="contact">
    <p>WhatsApp: <a href="https://wa.me/85290475370" target="_blank">+852 9047 5370</a></p>
    <p>Email: <a href="mailto:Orphee.ashworth1@gmail.com">Orphee.ashworth1@gmail.com</a></p>
    <p>&copy; 2026 orphee ASHWORTH. All rights reserved.</p>
</div>

<script>
// 超多新产品 + 对应新分类Item
const products = [
    //街头
    { id:1,name:"STREET PUNK REBEL",price:539,img:"https://picsum.photos/500/700?random=1",cat:"street"},
    { id:2,name:"ABANDONED DARK ALLEY",price:519,img:"https://picsum.photos/500/700?random=2",cat:"street"},
    //运动
    { id:3,name:"URBAN RUNNER FRESH",price:499,img:"https://picsum.photos/500/700?random=3",cat:"sport"},
    { id:4,name:"GYM ENERGY MIST",price:479,img:"https://picsum.photos/500/700?random=4",cat:"sport"},
    //木质调
    { id:5,name:"CONCRETE WOOD VIBE",price:569,img:"https://picsum.photos/500/700?random=11",cat:"wood"},
    { id:6,name:"VINTAGE SANDALWOOD",price:549,img:"https://picsum.photos/500/700?random=12",cat:"wood"},
    //烟熏调
    { id:7,name:"NEON SMOKE BREEZE",price:529,img:"https://picsum.photos/500/700?random=7",cat:"smoke"},
    { id:8,name:"DARK ALLEY TOBACCO",price:559,img:"https://picsum.photos/500/700?random=9",cat:"smoke"},
    //限定款
    { id:9,name:"HK LIMITED EDITION",price:629,img:"https://picsum.photos/500/700?random=15",cat:"limited"},
    { id:10,name:"SEASONAL DROP",price:599,img:"https://picsum.photos/500/700?random=14",cat:"limited"}
];

let cart = [];
let nowCat = "street";
const pList = document.getElementById("productsList");
const cartNum = document.getElementById("cartCount");
const cartNumText = document.getElementById("cartCountText");
const totalMoney = document.getElementById("totalPrice");
const catLinks = document.querySelectorAll(".category-nav a");

//渲染产品
function render(){
    pList.innerHTML = "";
    let arr = nowCat==="all" ? products : products.filter(x=>x.cat===nowCat);
    arr.forEach(p=>{
        let d = document.createElement("div");
        d.className="product";
        d.innerHTML = `
        <img src="${p.img}" class="product-img">
        <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="price">$${p.price}</div>
            <button class="add-cart" onclick="addGood(${p.id})">加入購物車</button>
        </div>
        `;
        pList.appendChild(d);
    });
}

//加入购物车+实时更新数量金额
window.addGood = function(id){
    let g = products.find(x=>x.id===id);
    cart.push(g);
    refreshCart();
};
function refreshCart(){
    let total = cart.reduce((s,i)=>s+i.price,0);
    cartNum.innerText = cart.length;
    cartNumText.innerText = cart.length;
    totalMoney.innerText = total;
}

//分类切换
catLinks.forEach(a=>{
    a.onclick = function(e){
        e.preventDefault();
        catLinks.forEach(x=>x.classList.remove("active"));
        this.classList.add("active");
        nowCat = this.getAttribute("data-cat");
        render();
    };
});

//核心功能：WhatsApp自动整理订单，发去你电话付款
window.sendOrderToWhatsApp = function(){
    if(cart.length===0){
        alert("購物車空空㗎，先加產品再付款！");
        return;
    }
    let list = "";
    cart.forEach((item,idx)=>{
        list += `${idx+1}.${item.name} - $${item.price}\n`;
    });
    let sum = cart.reduce((s,i)=>s+i.price,0);
    let msg = `您好！我想落單付款📦\n================\n${list}\n================\n總件數:${cart.length}件\n總金額:HKD$${sum}\n請回覆確認收單，多謝！`;
    let url = `https://wa.me/85290475370?text=${encodeURIComponent(msg)}`;
    window.open(url,"_blank");
};

//初始化
render();
refreshCart();
</script>

</body>
</html>
