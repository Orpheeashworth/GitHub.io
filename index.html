<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orphee ASHWORTH - 都市運動香氛</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;}
        :root{
            --bg-main:#0a0a0d;--bg-card:#14141a;--accent-neon:#ff3a3a;
            --text-primary:#f0f0f0;--border:#2a2a33;
        }
        body{background:var(--bg-main);color:var(--text-primary);padding-bottom:180px;}
        header{display:flex;justify-content:space-between;align-items:center;padding:18px 30px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,13,0.95);z-index:999;}
        .logo{font-size:36px;font-weight:900;text-transform:uppercase;color:var(--text-primary);}
        .header-right{display:flex;align-items:center;gap:25px;}
        .lang-select{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);padding:8px 12px;border-radius:4px;}
        .cart-icon{font-size:28px;position:relative;}
        #cartCount{position:absolute;top:-8px;right:-8px;background:var(--accent-neon);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
        .category-nav{display:flex;justify-content:center;gap:20px;padding:20px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
        .category-nav a{color:#a0a0a8;text-decoration:none;padding:4px 8px;}
        .category-nav a.active,.category-nav a:hover{color:var(--accent-neon);}
        .hero{height:70vh;display:flex;align-items:center;justify-content:center;}
        .hero-text p{display:none !important;}
        .container{max-width:1400px;margin:70px auto;padding:0 30px;}
        .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:35px;}
        .product{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
        .product-img{width:100%;height:350px;object-fit:cover;display:block;background:#222;}
        .product-info{padding:20px;}
        .price{color:var(--accent-neon);font-weight:900;margin:15px 0;}
        .add-cart{width:100%;padding:12px;border:2px solid var(--accent-neon);background:transparent;color:#fff;cursor:pointer;border-radius:4px;}
        .payment-section{margin:50px 0;text-align:center;}
        .payment-icons{display:flex;justify-content:center;flex-wrap:wrap;gap:25px;align-items:center;}
        .payment-icon{height:48px !important;display:block !important;visibility:visible !important;}
        .cart-bar{position:fixed;bottom:0;left:0;right:0;background:#14141a;border-top:1px solid var(--border);padding:18px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;}
        .whatsapp-btn{background:#25D366;color:#fff;border:none;padding:12px 24px;border-radius:4px;cursor:pointer;}
    </style>
</head>
<body>
<header>
    <div class="logo">orphee ASHWORTH</div>
    <div class="header-right">
        <select class="lang-select" id="langSel">
            <option value="zh-HK" selected>繁體</option>
            <option value="zh-CN">简体</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="es">Español</option>
        </select>
        <div class="cart-icon">🛒 <span id="cartNum">0</span></div>
    </div>
</header>

<nav class="category-nav">
    <a href="#" class="active" data-cat="street" data-txt="catStreet">街頭</a>
    <a href="#" data-cat="sport" data-txt="catSport">運動</a>
    <a href="#" data-cat="plant" data-txt="catPlant">植物調</a>
    <a href="#" data-cat="all" data-txt="catAll">全部</a>
</nav>

<section class="hero"><div class="hero-text"><h1>SCENT THE CITY</h1><p>no rules</p></div></section>

<div class="container"><h2 data-txt="pageTitle">香氛系列</h2><div class="products" id="proList"></div></div>

<div class="payment-section">
    <div class="payment-icons">
        <img src="https://img.icons8.com/fluency/96/visa.png" class="payment-icon" alt="Visa">
        <img src="https://img.icons8.com/fluency/96/mastercard.png" class="payment-icon" alt="Master">
        <img src="https://img.icons8.com/fluency/96/american-express.png" class="payment-icon" alt="AE">
        <img src="https://img.icons8.com/fluency/96/alipay.png" class="payment-icon" alt="支付宝">
        <img src="https://img.icons8.com/fluency/96/wechat-pay.png" class="payment-icon" alt="微信支付">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968298.png" class="payment-icon" alt="八达通">
    </div>
</div>

<div class="cart-bar">
    <div><span data-txt="totalTxt">總金額</span>：HK$<span id="priceSum">0</span></div>
    <button class="whatsapp-btn" data-txt="waBtn">WhatsApp落單付款</button>
</div>

<script>
// 1. 多国语言完整字典（粤语区常用+日韩法意西全包）
const langData = {
"zh-HK":{catStreet:"街頭",catSport:"運動",catPlant:"植物調",catAll:"全部",pageTitle:"香氛系列",totalTxt:"總金額",waBtn:"WhatsApp落單付款",addCartTxt:"加入購物車",emptyTip:"購物車暫時未有貨品！"},
"zh-CN":{catStreet:"街头",catSport:"运动",catPlant:"植物调",catAll:"全部",pageTitle:"香氛系列",totalTxt:"总金额",waBtn:"WhatsApp下单付款",addCartTxt:"加入购物车",emptyTip:"购物车暂时没有商品！"},
"en":{catStreet:"Street",catSport:"Sport",catPlant:"Plant",catAll:"All",pageTitle:"Scent Collection",totalTxt:"Total",waBtn:"Order via WhatsApp",addCartTxt:"Add to Cart",emptyTip:"Cart is empty!"},
"ja":{catStreet:"ストリート",catSport:"スポーツ",catPlant:"植物ノート",catAll:"すべて",pageTitle:"香水コレクション",totalTxt:"合計金額",waBtn:"WhatsApp注文",addCartTxt:"カート追加",emptyTip:"カートが空です！"},
"ko":{catStreet:"스트리트",catSport:"스포츠",catPlant:"식물향",catAll:"전체",pageTitle:"향수 컬렉션",totalTxt:"총금액",waBtn:"WhatsApp 주문",addCartTxt:"장바구니담기",emptyTip:"장바구니가 비었습니다!"},
"fr":{catStreet:"Street",catSport:"Sport",catPlant:"Végétal",catAll:"Tout",pageTitle:"Collection Parfums",totalTxt:"Total",waBtn:"Commander WhatsApp",addCartTxt:"Ajouter panier",emptyTip:"Panier vide !"},
"it":{catStreet:"Street",catSport:"Sport",catPlant:"Vegetale",catAll:"Tutto",pageTitle:"Collezione Profumi",totalTxt:"Totale",waBtn:"Ordina WhatsApp",addCartTxt:"Aggiungi carrello",emptyTip:"Carrello vuoto!"},
"es":{catStreet:"Street",catSport:"Deporte",catPlant:"Vegetal",catAll:"Todo",pageTitle:"Colección Perfumes",totalTxt:"Total",waBtn:"Pedir WhatsApp",addCartTxt:"Añadir carrito",emptyTip:"Carrito vacío!"}
};

// 2. 人形产品数据（自己换图链接即可）
const products = [
    {id:1,name:"STREET PUNK REBEL",price:539,img:"填你人形模特图链接1",cat:"street"},
    {id:2,name:"DARK ALLEY HK",price:519,img:"填你人形模特图链接2",cat:"street"},
    {id:3,name:"URBAN RUNNER",price:499,img:"填你人形模特图链接3",cat:"sport"},
    {id:4,name:"GREEN PLANT BREEZE",price:529,img:"填你人形模特图链接4",cat:"plant"}
];

let cart = [], nowCat = "street";
const langSel = document.getElementById("langSel");
const proList = document.getElementById("proList");
const cartNum = document.getElementById("cartNum");
const priceSum = document.getElementById("priceSum");
const navs = document.querySelectorAll(".category-nav a");

// 3. 核心：全局一键更新所有语言
function updateAllLang(){
    let l = langSel.value;
    document.querySelectorAll("[data-txt]").forEach(el=>{
        let k = el.getAttribute("data-txt");
        el.innerText = langData[l][k];
    });
    renderProducts();
}

// 4. 渲染产品+绑定多语言按钮
function renderProducts(){
    proList.innerHTML="";
    let arr = nowCat=="all"?products:products.filter(x=>x.cat===nowCat);
    let currLang = langSel.value;
    arr.forEach(it=>{
        let d = document.createElement("div");
        d.className="product";
        d.innerHTML = `
        <img src="${it.img}" class="product-img">
        <div class="product-info">
            <div>${it.name}</div>
            <div class="price">HK$${it.price}</div>
            <button class="add-cart" onclick="addCartFun(${it.id})">${langData[currLang].addCartTxt}</button>
        </div>`;
        proList.appendChild(d);
    });
}

// 5. 购物车纯修复逻辑，点即更新
window.addCartFun = function(id){
    let item = products.find(x=>x.id===id);
    cart.push(item); refreshCartData();
};
function refreshCartData(){
    cartNum.innerText = cart.length;
    let total = cart.reduce((a,b)=>a+b.price,0);
    priceSum.innerText = total;
}

// 6. 分类切换
navs.forEach(a=>a.onclick=e=>{
    e.preventDefault(); navs.forEach(x=>x.classList.remove("active"));
    a.classList.add("active"); nowCat = a.dataset.cat; updateAllLang();
});

// 7. 监听语言下拉 → 即时全站刷新
langSel.onchange = updateAllLang;

// 8. 初始化开机全正常跑
updateAllLang(); refreshCartData();
</script>
</body>
</html>
