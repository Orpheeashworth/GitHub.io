<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orphee ASHWORTH - 都市运动香氛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        :root {
            --bg-main: #0a0a0d;
            --bg-card: #14141a;
            --accent-neon: #ff3a3a;
            --accent-hk: #ff6b00;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a8;
            --border: #2a2a33;
            --glow: 0 0 15px rgba(255, 58, 58, 0.4);
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            background-image: 
            linear-gradient(rgba(10,10,13,0.95), rgba(10,10,13,0.98)),
            url('https://picsum.photos/1920/1080?grayscale&blur=2');
            background-attachment: fixed;
            line-height: 1.5;
            padding-bottom: 120px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(10,10,13,0.95);
            backdrop-filter: blur(8px);
            z-index: 999;
        }
        .logo {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--text-primary);
            text-shadow: var(--glow);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .lang-select {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 0;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-select:hover {
            border-color: var(--accent-neon);
            box-shadow: var(--glow);
        }
        .cart-icon {
            font-size: 24px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }
        .cart-icon:hover {
            transform: scale(1.1);
        }
        #cartCount {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-neon);
            color: var(--text-primary);
            font-size: 11px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: var(--glow);
        }
        .category-nav {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            background: rgba(10,10,13,0.9);
            backdrop-filter: blur(8px);
        }
        .category-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .category-nav a.active, .category-nav a:hover {
            color: var(--accent-neon);
            text-shadow: var(--glow);
        }
        .hero {
            width: 100%;
            height: 80vh;
            background: 
            linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
            url('https://picsum.photos/1920/1080?grayscale');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(transparent, var(--bg-main));
        }
        .hero-text {z-index:2;}
        .hero h1 {
            font-size:7vw;font-weight:900;text-transform:uppercase;
            letter-spacing:-3px;margin-bottom:15px;line-height:1;
            text-shadow:0 0 20px rgba(255, 107, 0, 0.6);
        }
        .hero p {
            font-size:1.8vw;text-transform:uppercase;letter-spacing:4px;
            opacity:0.9;color:var(--accent-hk);
        }
        .container {max-width:1400px;margin:70px auto;padding:0 30px;}
        .section-title {
            font-size:32px;font-weight:900;text-transform:uppercase;
            margin-bottom:40px;border-bottom:1px solid var(--border);
            padding-bottom:12px;letter-spacing:1px;
        }
        .products {display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:35px;}
        .product {
            background:var(--bg-card);border:1px solid var(--border);
            transition:all 0.4s ease;overflow:hidden;position:relative;
        }
        .product::before {
            content:'';position:absolute;top:0;left:0;right:0;height:3px;
            background:linear-gradient(90deg,var(--accent-neon),var(--accent-hk));
            transform:scaleX(0);transition:transform 0.4s;
        }
        .product:hover::before{transform:scaleX(1);}
        .product:hover{transform:translateY(-8px);border-color:var(--accent-neon);box-shadow:0 10px 30px rgba(255,58,58,0.2);}
        .product-img {width:100%;height:350px;object-fit:cover;background:#1a1a1a;filter:grayscale(30%) contrast(1.2);transition:filter 0.4s;}
        .product:hover .product-img{filter:grayscale(0%) contrast(1.1);}
        .product-info{padding:20px;}
        .product-name{font-size:17px;font-weight:700;text-transform:uppercase;margin-bottom:10px;letter-spacing:0.8px;}
        .price{font-size:20px;font-weight:900;color:var(--accent-neon);margin-bottom:15px;}
        .add-cart {
            width:100%;padding:12px;background:transparent;color:var(--text-primary);
            border:1px solid var(--accent-neon);font-weight:900;text-transform:uppercase;
            font-size:12px;letter-spacing:1.5px;cursor:pointer;transition:all 0.3s;
        }
        .add-cart:hover{background:var(--accent-neon);color:var(--bg-main);box-shadow:var(--glow);}
        .cart-bar {
            position:fixed;bottom:0;left:0;right:0;background:rgba(20,20,26,0.95);
            backdrop-filter:blur(8px);border-top:1px solid var(--border);
            padding:18px 30px;display:flex;justify-content:space-between;align-items:center;z-index:998;
        }
        .cart-total{font-size:20px;font-weight:900;text-transform:uppercase;}
        .checkout-btn {
            padding:12px 30px;background:linear-gradient(90deg,var(--accent-neon),var(--accent-hk));
            color:var(--text-primary);border:none;font-weight:900;text-transform:uppercase;
            cursor:pointer;transition:all 0.3s;box-shadow:var(--glow);
        }
        .checkout-btn:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(255,58,58,0.6);}
        .contact {
            max-width:1400px;margin:70px auto 0;padding:0 30px 50px;border-top:1px solid var(--border);
            padding-top:50px;text-align:center;color:var(--text-secondary);font-size:15px;
        }
        .contact a{color:var(--accent-hk);text-decoration:none;font-weight:700;transition:all 0.3s;}
        .contact a:hover{color:var(--accent-neon);text-shadow:var(--glow);}
        @media(max-width:768px){
            .hero h1{font-size:12vw;}
            .hero p{font-size:4vw;}
            .products{grid-template-columns:repeat(2,1fr);gap:20px;}
            header{padding:15px 20px;}
            .category-nav{gap:20px;padding:15px 20px;flex-wrap:wrap;}
            .category-nav a{font-size:14px;}
        }
    </style>
</head>
<body>

<header>
    <div class="logo">orphee ASHWORTH</div>
    <div class="header-right">
        <select class="lang-select" id="langSelect">
            <option value="zh-HK">繁體</option>
            <option value="zh-CN">简体</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
        </select>
        <div class="cart-icon">🛒 <span id="cartCount">0</span></div>
    </div>
</header>

<nav class="category-nav">
    <a href="#" class="active" data-i18n="street">街頭</a>
    <a href="#" data-i18n="sport">運動</a>
    <a href="#" data-i18n="all">全部</a>
</nav>

<section class="hero">
    <div class="hero-text">
        <h1 data-i18n="hero-title">SCENT THE CITY</h1>
        <p data-i18n="hero-sub">URBAN SCENT, NO RULES</p>
    </div>
</section>

<div class="container">
    <h2 class="section-title" data-i18n="products-title">街頭系列</h2>
    <div class="products" id="productsList"></div>
</div>

<div class="cart-bar">
    <div class="cart-total">
        <span data-i18n="total">總金額</span>: HKD $<span id="totalPrice">0</span>
    </div>
    <button class="checkout-btn" data-i18n="checkout">立即結賬</button>
</div>

<div class="contact">
    <!-- 已改你新电话 -->
    <p>WhatsApp: <a href="https://wa.me/85290475370" target="_blank">+852 9047 5370</a></p>
    <!-- 已填入你专属Email -->
    <p>Email: <a href="mailto:Orphee.ashworth1@gmail.com">Orphee.ashworth1@gmail.com</a></p>
    <p>&copy; 2014 orphee ASHWORTH. All rights reserved.</p>
</div>

<script>
// 加多超多产品+每张独立配图，分街头/运动 item 分类
const products = [
    { id: 1, name: "STREET PUNK REBEL", price: 539, img: "https://picsum.photos/500/700?random=1", category: "street" },
    { id: 2, name: "ABANDONED DARK ALLEY", price: 519, img: "https://picsum.photos/500/700?random=2", category: "street" },
    { id: 3, name: "URBAN RUNNER FRESH", price: 499, img: "https://picsum.photos/500/700?random=3", category: "sport" },
    { id: 4, name: "GYM ENERGY MIST", price: 479, img: "https://picsum.photos/500/700?random=4", category: "sport" },
    { id: 5, name: "GRAFFITI CITY CITRUS", price: 459, img: "https://picsum.photos/500/700?random=5", category: "street" },
    { id: 6, name: "BOXING RING SMOKE", price: 559, img: "https://picsum.photos/500/700?random=6", category: "sport" },
    { id: 7, name: "NEON STREET BREEZE", price: 529, img: "https://picsum.photos/500/700?random=7", category: "street" },
    { id: 8, name: "OUTDOOR SPORT VIBES", price: 489, img: "https://picsum.photos/500/700?random=8", category: "sport" },
    { id: 9, name: "MIDNIGHT HK STREET", price: 549, img: "https://picsum.photos/500/700?random=9", category: "street" },
    { id:10, name: "ATHLETE DRY FRESH", price: 469, img: "https://picsum.photos/500/700?random=10", category: "sport" },
    { id:11, name: "CONCRETE STREET WOOD", price: 569, img: "https://picsum.photos/500/700?random=11", category: "street" },
    { id:12, name: "TRAINING DAY BOOST", price: 509, img: "https://picsum.photos/500/700?random=12", category: "sport" }
];

let cart = [];
let currentCategory = "street";
const productsEl = document.getElementById('productsList');
const cartCountEl = document.getElementById('cartCount');
const totalPriceEl = document.getElementById('totalPrice');
const sectionTitleEl = document.querySelector('.section-title');
const categoryLinks = document.querySelectorAll('.category-nav a');

function renderProducts(category = "all") {
    productsEl.innerHTML = '';
    const filteredProducts = category === "all" ? products : products.filter(p => p.category === category);
    filteredProducts.forEach(p => {
        const productCard = document.createElement('div');
        productCard.className = 'product';
        productCard.innerHTML = `
        <img src="${p.img}" alt="${p.name}" class="product-img">
        <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="price">$${p.price}</div>
            <button class="add-cart" onclick="addToCart(${p.id})" data-i18n="add-cart">加入購物車</button>
        </div>
        `;
        productsEl.appendChild(productCard);
    });
    updateI18n();
}

categoryLinks.forEach(link => {
    link.addEventListener('click', function(e){
        e.preventDefault();
        categoryLinks.forEach(l=>l.classList.remove('active'));
        this.classList.add('active');
        currentCategory = this.getAttribute('data-i18n');
        if(currentCategory==="street") sectionTitleEl.setAttribute('data-i18n','street-title');
        else if(currentCategory==="sport") sectionTitleEl.setAttribute('data-i18n','sport-title');
        else sectionTitleEl.setAttribute('data-i18n','products-title');
        renderProducts(currentCategory);
        updateI18n();
    });
});

window.addToCart = function(id){
    const item = products.find(p=>p.id===id);
    cart.push(item);
    updateCart();
};
function updateCart(){
    cartCountEl.textContent = cart.length;
    const total = cart.reduce((sum,item)=>sum+item.price,0);
    totalPriceEl.textContent = total;
}

const i18n = {
    "zh-HK":{"hero-title":"SCENT THE CITY","hero-sub":"URBAN SCENT, NO RULES","street":"街頭","sport":"運動","all":"全部","street-title":"街頭系列","sport-title":"運動系列","products-title":"全部系列","total":"總金額","checkout":"立即結賬","add-cart":"加入購物車"},
    "zh-CN":{"hero-title":"SCENT THE CITY","hero-sub":"URBAN SCENT, NO RULES","street":"街头","sport":"运动","all":"全部","street-title":"街头系列","sport-title":"运动系列","products-title":"全部系列","total":"总金额","checkout":"立即结账","add-cart":"加入购物车"},
    "en":{"hero-title":"SCENT THE CITY","hero-sub":"URBAN SCENT, NO RULES","street":"STREET","sport":"SPORT","all":"ALL","street-title":"STREET COLLECTION","sport-title":"SPORT COLLECTION","products-title":"ALL COLLECTION","total":"TOTAL","checkout":"CHECKOUT","add-cart":"ADD TO CART"},
    "fr":{"hero-title":"SCENT THE CITY","hero-sub":"URBAN SCENT, NO RULES","street":"RUE","sport":"SPORT","all":"TOUS","street-title":"COLLECTION RUE","sport-title":"COLLECTION SPORT","products-title":"TOUTE LA COLLECTION","total":"TOTAL","checkout":"PAYER","add-cart":"AJOUTER AU PANIER"},
    "it":{"hero-title":"SCENT THE CITY","hero-sub":"URBAN SCENT, NO RULES","street":"STRADA","sport":"SPORT","all":"TUTTI","street-title":"COLLEZIONE STRADA","sport-title":"COLLEZIONE SPORT","products-title":"TUTTA LA COLLECTION","total":"TOTALE","checkout":"PAGA","add-cart":"AGGIUNGI AL CARRELLO"},
    "es":{"hero-title":"SCENT THE CITY","hero-sub":"URBAN SCENT, NO RULES","street":"CALLE","sport":"DEPORTE","all":"TODOS","street-title":"COLECCIÓN CALLE","sport-title":"COLECCIÓN DEPORTE","products-title":"TODA LA COLECCIÓN","total":"TOTAL","checkout":"PAGAR","add-cart":"AÑADIR AL CARRITO"},
    "ja":{"hero-title":"SCENT THE CITY","hero-sub":"URBAN SCENT, NO RULES","street":"ストリート","sport":"スポーツ","all":"すべて","street-title":"ストリートコレクション","sport-title":"スポーツコレクション","products-title":"すべてのコレクション","total":"合計","checkout":"レジへ","add-cart":"カートに追加"},
    "ko":{"hero-title":"SCENT THE CITY","hero-sub":"URBAN SCENT, NO RULES","street":"스트리트","sport":"스포츠","all":"전체","street-title":"스트리트 컬렉션","sport-title":"스포츠 컬렉션","products-title":"전체 컬렉션","total":"총액","checkout":"결제하기","add-cart":"장바구니에 추가"}
};
function updateI18n(){
    const lang = document.getElementById('langSelect').value;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
        const k = el.getAttribute('data-i18n');
        el.textContent = i18n[lang][k];
    });
    categoryLinks.forEach(l=>{
        const k = l.getAttribute('data-i18n');
        l.setAttribute('data-category',k);
    });
}
document.getElementById('langSelect').addEventListener('change',updateI18n);
renderProducts("street");
updateI18n();
</script>

</body>
</html>
