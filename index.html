<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orphee & Ashworth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', serif;
        }
        body {
            background: #000;
            color: #fff;
        }
        /* 頂部導航 */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
        }
        .menu-btn {
            font-size: 24px;
            color: #fff;
            background: none;
            border: none;
        }
        .logo {
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .header-right {
            display: flex;
            gap: 15px;
        }
        .header-right button {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
        }
        /* 主視覺香水圖 */
        .hero-perfume {
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(to bottom, #111, #000);
        }
        .hero-perfume img {
            height: 180px;
            object-fit: contain;
        }
        /* 產品列表 */
        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            padding: 20px;
            background: #f8f5f0;
            color: #222;
        }
        .product-card {
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
        }
        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin: 8px 0 4px;
        }
        .product-sub {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        .product-price {
            font-size: 14px;
            color: #333;
            margin-bottom: 10px;
        }
        /* 底部付款 & 聯絡 */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f5f0;
        }
        .payment-icons {
            display: flex;
            gap: 10px;
        }
        .payment-icons img {
            height: 24px;
        }
        .whatsapp-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #25d366;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <button class="menu-btn">☰</button>
        <div class="logo">Orphee & Ashworth</div>
        <div class="header-right">
            <button>🔍</button>
            <button>👤</button>
        </div>
    </header>

    <div class="hero-perfume">
        <img src="https://i.imgur.com/8X7ZQ2H.png" alt="Perfume">
    </div>

    <div class="products">
        <div class="product-card">
            <img src="https://i.imgur.com/3kF8X9Y.png" alt="Orphee & Ashworth">
            <div class="product-name">Orphee & Ashworth</div>
            <div class="product-sub">香風水</div>
            <div class="product-price">$89.0</div>
        </div>
        <div class="product-card">
            <img src="https://i.imgur.com/9L7mR2T.png" alt="Sinnudey">
            <div class="product-name">Sinnudey</div>
            <div class="product-sub">香風水</div>
            <div class="product-price">$99.0</div>
        </div>
        <div class="product-card">
            <img src="https://i.imgur.com/4D6fG7H.png" alt="Mnhaier">
            <div class="product-name">Mnhaier</div>
            <div class="product-sub">香風水</div>
            <div class="product-price">$25.0</div>
        </div>
        <div class="product-card">
            <img src="https://i.imgur.com/7P9Qr1S.png" alt="Sishwory">
            <div class="product-name">Sishwory</div>
            <div class="product-sub">香風水</div>
            <div class="product-price">$99.0</div>
        </div>
    </div>

    <div class="footer-bar">
        <div class="payment-icons">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Visa_Inc._logo.svg/1200px-Visa_Inc._logo.svg.png" alt="Visa">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Mastercard-logo.svg/1200px-Mastercard-logo.svg.png" alt="Mastercard">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/AliPay_logo.svg/1200px-AliPay_logo.svg.png" alt="Alipay">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/WeChat_Pay_logo.svg/1200px-WeChat_Pay_logo.svg.png" alt="WeChat Pay">
        </div>
        <button class="whatsapp-btn">
            <span>📩</span> Whastapp
        </button>
    </div>
</body>
</html>
