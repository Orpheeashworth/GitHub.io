<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orphee ASHWORTH - 都市運動香氛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        :root {
            --bg-main: #0a0a0d;
            --bg-card: #14141a;
            --accent-neon: #ff3a3a;
            --accent-hk: #ff6b00;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a8;
            --border: #2a2a33;
            --glow: 0 0 15px rgba(255, 58, 58, 0.4);
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            background-image:
            linear-gradient(rgba(10,10,13,0.95), rgba(10,10,13,0.98)),
            url('https://picsum.photos/1920/1080?grayscale&blur=2');
            background-attachment: fixed;
            line-height: 1.5;
            padding-bottom: 180px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(10,10,13,0.95);
            backdrop-filter: blur(8px);
            z-index: 999;
        }
        .logo {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--text-primary);
            text-shadow: var(--glow);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .lang-select {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 0;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
        }
        .cart-icon {
            font-size: 24px;
            position: relative;
        }
        #cartCount {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-neon);
            width: 18px;height: 18px;border-radius: 50%;
            display: flex;align-items: center;justify-content: center;
            font-size: 11px;font-weight: bold;
        }
        .category-nav {
            display: flex;justify-content: center;gap: 25px;
            padding: 20px 30px;border-bottom: 1px solid var(--border);
            flex-wrap: wrap;background: rgba(10,10,13,0.9);
        }
        .category-nav a {
            color: var(--text-secondary);text-decoration: none;
            font-size: 15px;font-weight: 700;text-transform: uppercase;
        }
        .category-nav a.active,.category-nav a:hover {
            color: var(--accent-neon);text-shadow: var(--glow);
        }
        .hero {
            width: 100%;height: 80vh;
            background: linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)),
            url('https://picsum.photos/1920/1080?grayscale');
            background-size: cover;background-position: center;
            display: flex;align-items: center;justify-content: center;text-align: center;
        }
        .hero-text{z-index:2;}
        .hero h1{font-size:7vw;font-weight:900;text-transform:uppercase;}
        .hero p{font-size:1.8vw;color:var(--accent-hk);text-transform:uppercase;}
        .container{max-width:1400px;margin:70px auto;padding:0 30px;}
        .section-title{font-size:32px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:40px;}
        .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:35px;}
        .product{background:var(--bg-card);border:1px solid var(--border);overflow:hidden;position:relative;}
        .product-img{width:100%;height:350px;object-fit:cover;}
        .product-info{padding:20px;}
        .product-name{font-size:17px;text-transform:uppercase;font-weight:700;}
        .price{font-size:20px;color:var(--accent-neon);font-weight:900;margin:15px 0;}
        .add-cart{width:100%;padding:12px;background:transparent;border:1px solid var(--accent-neon);color:#fff;text-transform:uppercase;font-weight:900;cursor:pointer;}
        .add-cart:hover{background:var(--accent-neon);color:#000;}

        /* 付款方式专区 */
        .pay-wrap{max-width:1400px;margin:30px auto;text-align:center;padding:0 20px;}
        .pay-wrap h3{margin-bottom:15px;text-transform:uppercase;color:var(--text-secondary);}
        .pay-icons{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;align-items:center;}
        .pay-icons img{height:42px;border-radius:4px;}

        .cart-bar{position:fixed;bottom:0;left:0;right:0;background:#14141a;border-top:1px solid var(--border);padding:18px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;}
        .whatsapp-pay-btn{background:#25D366;color:#fff;border:none;padding:10px 16px;font-weight:bold;cursor:pointer;}
        .contact{text-align:center;padding:50px 20px;color:var(--text-secondary);border-top:1px solid var(--border);margin-top:50px;}
        @media(max-width:768px){
            .products{grid-template-columns:repeat(2,1fr);}
            .hero h1{font-size:12vw;}
        }
    </style>
</head>
<body>

<header>
    <div class="logo">orphee ASHWORTH</div>
    <div class="header-right">
        <!-- 默认选中繁体，唔会跳简体 -->
        <select class="lang-select" id="langSelect">
            <option value="zh-HK" selected>繁體</option>
            <option value="zh-CN">简体</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
        </select>
        <div class="cart-icon">🛒 <span id="cartCount">0</span></div>
    </div>
</header>

<!-- 多Item分类全部保留 -->
<nav class="category-nav">
    <a href="#" class="active" data-cat="street" data-i18n="street">街頭</a>
    <a href="#" data-cat="sport" data-i18n="sport">運動</a>
    <a href="#" data-cat="wood" data-i18n="wood">木質調</a>
    <a href="#" data-cat="smoke" data-i18n="smoke">煙燻調</a>
    <a href="#" data-cat="limited" data-i18n="limited">限定款</a>
    <a href="#" data-cat="all" data-i18n="all">全部</a>
</nav>

<section class="hero">
    <div class="hero-text">
        <h1 data-i18n="hero-title">SCENT THE CITY</h1>
        <p data-i18n="hero-sub">URBAN SCENT </p>
    </div>
</section>

<div class="container">
    <h2 class="section-title" data-i18n="street-title">街頭系列</h2>
    <div class="products" id="productsList"></div>
</div>

<!-- 👉 全新补齐：Visa/Master/AE/支付宝/微信/八达通 全部付款图标 -->
<div class="pay-wrap">
    <h3 data-i18n="pay_title">支持付款方式</h3>
    <div class="pay-icons">
        <img src="https://img.icons8.com/fluency/96/000000/visa.png" alt="Visa">
        <img src="https://img.icons8.com/fluency/96/000000/mastercard.png" alt="Mastercard">
        <img src="https://img.icons8.com/fluency/96/000000/american-express.png" alt="AE运通">
        <img src="https://img.icons8.com/fluency/96/000000/alipay.png" alt="支付宝">
        <img src="https://img.icons8.com/fluency/96/000000/wechat-pay.png" alt="微信支付">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968298.png" alt="八达通">
    </div>
</div>

<div class="cart-bar">
    <div class="cart-total">
        <span data-i18n="total">總金額</span>: HKD$<span id="totalPrice">0</span>
    </div>
    <button class="whatsapp-pay-btn" onclick="sendOrderToWhatsApp()" data-i18n="wa_order">WhatsApp落單付款</button>
</div>

<div class="contact">
    <p>WhatsApp: <a href="https://wa.me/85290475370" target="_blank">+852 9047 5370</a></p>
    <p>Email: <a href="mailto:Orphee.ashworth1@gmail.com">Orphee.ashworth1@gmail.com</a></p>
    <p>&copy; 2014 orphee ASHWORTH</p>
</div>

<script>
// 产品+分类齐全
const products = [
    {id:1,name:"STREET PUNK REBEL",price:539,img:"https://picsum.photos/500/700?random=1",cat:"street"},
    {id:2,name:"ABANDONED ALLEY",price:519,img:"https://picsum.photos/500/700?random=2",cat:"street"},
    {id:3,name:"URBAN RUNNER",price:499,img:"https://picsum.photos/500/700?random=3",cat:"sport"},
    {id:4,name:"GYM ENERGY",price:479,img:"https://picsum.photos/500/700?random=4",cat:"sport"},
    {id:5,name:"WOOD CITY VIBE",price:569,img:"https://picsum.photos/500/700?random=11",cat:"wood"},
    {id:6,name:"TOBACCO SMOKE",price:559,img:"https://picsum.photos/500/700?random=9",cat:"smoke"},
    {id:7,name:"HK LIMITED EDIT",price:629,img:"https://picsum.photos/500/700?random=15",cat:"limited"}
];

let cart = [];
let nowCat = "street";
const pList = document.getElementById("productsList");
const cartNum = document.getElementById("cartCount");
const totalPrice = document.getElementById("totalPrice");
const catLinks = document.querySelectorAll(".category-nav a");

// 渲染产品
function render(){
    pList.innerHTML="";
    let arr = nowCat==="all"?products:products.filter(x=>x.cat===nowCat);
    arr.forEach(p=>{
        let d=document.createElement("div");
        d.className="product";
        d.innerHTML=`
        <img src="${p.img}" class="product-img">
        <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="price">$${p.price}</div>
            <button class="add-cart" onclick="addCart(${p.id})" data-i18n="add_btn">加入購物車</button>
        </div>`;
        pList.appendChild(d);
    });
    updateI18n();
}
window.addCart=function(id){
    cart.push(products.find(x=>x.id===id));
    refreshCart();
};
function refreshCart(){
    cartNum.innerText=cart.length;
    let sum=cart.reduce((a,b)=>a+b.price,0);
    totalPrice.innerText=sum;
}

// 分类切换
catLinks.forEach(a=>a.onclick=function(e){
    e.preventDefault();
    catLinks.forEach(x=>x.classList.remove("active"));
    this.classList.add("active");
    nowCat=this.getAttribute("data-cat");render();
});

// WhatsApp繁体不乱码订单发送
window.sendOrderToWhatsApp=function(){
    if(cart.length===0){alert("購物車未有貨品，請先加購！");return;}
    let list="📦客戶落單:\n";
    cart.forEach((it,i)=>list+=`${i+1}.${it.name} | $${it.price}\n`);
    let total=cart.reduce((s,x)=>s+x.price,0);
    let msg=`${list}----------------\n總數:${cart.length}件\n總金額:HKD$${total}\n請回覆確認收款🙏`;
    window.open(`https://wa.me/85290475370?text=${encodeURIComponent(msg)}`,"_blank");
};

// 8国语言字典（繁体齐全）
const i18n={
"zh-HK":{"street":"街頭","sport":"運動","wood":"木質調","smoke":"煙燻調","limited":"限定款","all":"全部",
"street-title":"街頭系列","total":"總金額","wa_order":"WhatsApp落單付款","add_btn":"加入購物車","pay_title":"支持付款方式"},
"zh-CN":{"street":"街头","sport":"运动","wood":"木质调","smoke":"烟熏调","limited":"限定款","all":"全部",
"street-title":"街头系列","total":"总金额","wa_order":"WhatsApp下单付款","add_btn":"加入购物车","pay_title":"支持付款方式"},
"en":{"street":"STREET","sport":"SPORT","wood":"WOOD","smoke":"SMOKE","limited":"LIMITED","all":"ALL"}
};
function updateI18n(){
    let lang=document.getElementById("langSelect").value;
    document.querySelectorAll("[data-i18n]").forEach(el=>{
        let k=el.getAttribute("data-i18n");
        if(i18n[lang]&&i18n[lang][k])el.textContent=i18n[lang][k];
    });
}
document.getElementById("langSelect").onchange=updateI18n;

// 初始化默认繁体+刷新购物车
render();refreshCart();updateI18n();
</script>

</body>
</html>
