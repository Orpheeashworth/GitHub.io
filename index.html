<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>Orphee & Ashworth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a0b35; /* 深紫色背景 */
            color: #f8f5f2;
            font-family: "PingFang SC", "Microsoft JhengHei", Arial, sans-serif;
            line-height: 1.6;
        }
        .logo {
            width: 300px;
            margin: 30px auto;
            display: block;
            border-radius: 50%;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .perfume {
            background: rgba(255, 255, 255, 0.1); /* 半透明白色卡片 */
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(5px);
        }
        .perfume h2 {
            color: #ffd700; /* 金色標題 */
            margin-bottom: 10px;
        }
        .note {
            color: #d4c2e8;
            font-size: 0.95em;
            margin: 5px 0;
        }
        .price {
            color: #ff6b6b;
            font-size: 22px;
            font-weight: bold;
            margin: 12px 0;
        }
        .buy {
            background: #ffd700;
            color: #1a0b35;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .buy:hover {
            background: #ffed4e;
        }
        .local {
            text-align: center;
            margin: 40px 0;
            color: #d4c2e8;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo（無水印版本） -->
        <img class="logo" src="https://picsum.photos/id/65/300/300" alt="Orphee & Ashworth Logo">

        <!-- 第一款香水 -->
        <div class="perfume">
            <h2>「午夜木蘭」</h2>
            <p class="note">前調：佛手柑、黑加侖</p>
            <p class="note">中調：木蘭、晚香玉</p>
            <p class="note">後調：檀香木、麝香</p>
            <div class="price">HK$480 / 50ml</div>
            <button class="buy" onclick="window.location.href='https://wa.me/85290475370'">立即選購</button>
        </div>

        <!-- 第二款香水 -->
        <div class="perfume">
            <h2>「海風橙花」</h2>
            <p class="note">前調：橙花、檸檬</p>
            <p class="note">中調：茉莉、海鹽</p>
            <p class="note">後調：白麝香、琥珀</p>
            <div class="price">HK$420 / 50ml</div>
            <button class="buy" onclick="window.location.href='https://wa.me/85290475370'">立即選購</button>
        </div>

        <!-- 第三款香水 -->
        <div class="perfume">
            <h2>「晨曦玫瑰」</h2>
            <p class="note">前調：粉紅胡椒、荔枝</p>
            <p class="note">中調：大馬士革玫瑰、牡丹</p>
            <p class="note">後調：龍涎香、廣藿香</p>
            <div class="price">HK$520 / 50ml</div>
            <button class="buy" onclick="window.location.href='https://wa.me/85290475370'">立即選購</button>
        </div>

        <!-- 聯絡資訊 -->
        <div class="local">
            <p>📍 本店位於：香港九龍旺角</p>
            <p>📞 WhatsApp：9047-5370</p>
            <p>💳 付款方式：PayMe / FPS / 銀行轉賬</p>
        </div>
    </div>
</body>
</html>
