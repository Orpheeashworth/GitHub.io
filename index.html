<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STREET SCENT - 街头潮牌香水</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        :root {
            --primary: #ffffff;
            --accent: #ff3333;
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --border: #2a2a2a;
        }
        body {
            background: var(--bg-dark);
            color: var(--primary);
            line-height: 1.4;
            padding-bottom: 120px;
        }
        /* 头部 - Supreme式极简红标风 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            z-index: 999;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--primary);
            /* 替换成你的Logo图片即可 */
            content: url('你的logo.png');
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .lang-select {
            background: var(--bg-card);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 0;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
        }
        .cart-icon {
            font-size: 22px;
            cursor: pointer;
            position: relative;
        }
        #cartCount {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent);
            color: var(--primary);
            font-size: 11px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        /* 首屏Banner - Supreme联名大片风 */
        .hero {
            width: 100%;
            height: 70vh;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://picsum.photos/1920/1080?grayscale');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        .hero-text {
            z-index: 2;
        }
        .hero h1 {
            font-size: 6vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
            margin-bottom: 10px;
            line-height: 1;
        }
        .hero p {
            font-size: 1.5vw;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.8;
        }
        /* 产品区 - Supreme式网格 */
        .container {
            max-width: 1400px;
            margin: 60px auto;
            padding: 0 24px;
        }
        .section-title {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
        }
        .product {
            background: var(--bg-card);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .product:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }
        .product-img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background: #1a1a1a;
            filter: grayscale(20%);
            transition: filter 0.3s;
        }
        .product:hover .product-img {
            filter: grayscale(0%);
        }
        .product-info {
            padding: 16px;
        }
        .product-name {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .price {
            font-size: 18px;
            font-weight: 900;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .add-cart {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-cart:hover {
            background: var(--accent);
            color: var(--primary);
        }
        /* 购物车栏 - 固定底部 */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 998;
        }
        .cart-total {
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
        }
        .checkout-btn {
            padding: 10px 24px;
            background: var(--accent);
            color: var(--primary);
            border: none;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }
        /* 联系区 - 极简风 */
        .contact {
            max-width: 1400px;
            margin: 60px auto 0;
            padding: 0 24px 40px;
            border-top: 1px solid var(--border);
            padding-top: 40px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
        .contact a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }
        .contact a:hover {
            color: var(--accent);
        }
        /* 响应式 */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 10vw;
            }
            .hero p {
                font-size: 3vw;
            }
            .products {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">STREET SCENT</div>
    <div class="header-right">
        <select class="lang-select" id="langSelect">
            <option value="zh-HK">繁體</option>
            <option value="zh-CN">简体</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
        </select>
        <div class="cart-icon">🛒 <span id="cartCount">0</span></div>
    </div>
</header>

<section class="hero">
    <div class="hero-text">
        <h1 data-i18n="hero-title">SCENT THE STREET</h1>
        <p data-i18n="hero-sub">街头气味，无需定义</p>
    </div>
</section>

<div class="container">
    <h2 class="section-title" data-i18n="products-title">香水系列</h2>
    <div class="products" id="productsList"></div>
</div>

<div class="cart-bar">
    <div class="cart-total">
        <span data-i18n="total">總金額</span>: HKD $<span id="totalPrice">0</span>
    </div>
    <button class="checkout-btn" data-i18n="checkout">立即結賬</button>
</div>

<div class="contact">
    <p>WhatsApp: <a href="https://wa.me/85291257354" target="_blank">+852 9125 7354</a></p>
    <p>Email: <a href="mailto:contact@streetscent.com">contact@streetscent.com</a></p>
    <p>&copy; 2026 STREET SCENT. All rights reserved.</p>
</div>

<script>
    // 10款香水产品（完全Supreme联名风命名）
    const products = [
        { id: 1, name: "BOX LOGO WOOD", price: 499, img: "https://picsum.photos/500/700?random=1" },
        { id: 2, name: "NYC STREET PULSE", price: 459, img: "https://picsum.photos/500/700?random=2" },
        { id: 3, name: "MM6 LEATHER CODE", price: 529, img: "https://picsum.photos/500/700?random=3" },
        { id: 4, name: "BOXING RING SMOKE", price: 479, img: "https://picsum.photos/500/700?random=4" },
        { id: 5, name: "GRAFFITI CITRUS", price: 439, img: "https://picsum.photos/500/700?random=5" },
        { id: 6, name: "FURRY PUNCH", price: 549, img: "https://picsum.photos/500/700?random=6" },
        { id: 7, name: "HOODIE NIGHT", price: 469, img: "https://picsum.photos/500/700?random=7" },
        { id: 8, name: "EAGLE WING", price: 519, img: "https://picsum.photos/500/700?random=8" },
        { id: 9, name: "STREET REBEL", price: 489, img: "https://picsum.photos/500/700?random=9" },
        { id: 10, name: "RAW SUPREME", price: 599, img: "https://picsum.photos/500/700?random=10" }
    ];

    // 购物车逻辑
    let cart = [];
    const productsEl = document.getElementById('productsList');
    const cartCountEl = document.getElementById('cartCount');
    const totalPriceEl = document.getElementById('totalPrice');

    // 渲染产品
    function renderProducts() {
        productsEl.innerHTML = '';
        products.forEach(p => {
            const productCard = document.createElement('div');
            productCard.className = 'product';
            productCard.innerHTML = `
                <img src="${p.img}" alt="${p.name}" class="product-img">
                <div class="product-info">
                    <div class="product-name">${p.name}</div>
                    <div class="price">$${p.price}</div>
                    <button class="add-cart" onclick="addToCart(${p.id})" data-i18n="add-cart">加入購物車</button>
                </div>
            `;
            productsEl.appendChild(productCard);
        });
        updateI18n();
    }

    // 加入购物车
    window.addToCart = function(id) {
        const item = products.find(p => p.id === id);
        cart.push(item);
        updateCart();
    }

    // 更新购物车
    function updateCart() {
        cartCountEl.textContent = cart.length;
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        totalPriceEl.textContent = total;
    }

    // 多语言翻译（完全匹配Supreme国际联名风）
    const i18n = {
        "zh-HK": {
            "hero-title": "SCENT THE STREET",
            "hero-sub": "街頭氣味，無需定義",
            "products-title": "香水系列",
            "total": "總金額",
            "checkout": "立即結賬",
            "add-cart": "加入購物車"
        },
        "zh-CN": {
            "hero-title": "SCENT THE STREET",
            "hero-sub": "街头气味，无需定义",
            "products-title": "香水系列",
            "total": "总金额",
            "checkout": "立即结账",
            "add-cart": "加入购物车"
        },
        "en": {
            "hero-title": "SCENT THE STREET",
            "hero-sub": "STREET SCENT, NO RULES",
            "products-title": "FRAGRANCE COLLECTION",
            "total": "TOTAL",
            "checkout": "CHECKOUT",
            "add-cart": "ADD TO CART"
        },
        "fr": {
            "hero-title": "SCENT THE STREET",
            "hero-sub": "PARFUM DE RUE, SANS RÈGLES",
            "products-title": "COLLECTION PARFUM",
            "total": "TOTAL",
            "checkout": "PAYER",
            "add-cart": "AJOUTER AU PANIER"
        },
        "it": {
            "hero-title": "SCENT THE STREET",
            "hero-sub": "PROFUMO DI STRADA, SENZA REGOLE",
            "products-title": "COLLEZIONE PROFUMI",
            "total": "TOTALE",
            "checkout": "PAGA",
            "add-cart": "AGGIUNGI AL CARRELLO"
        },
        "es": {
            "hero-title": "SCENT THE STREET",
            "hero-sub": "FRAGANCIA CALLEJERA, SIN REGLAS",
            "products-title": "COLECCIÓN FRAGANCIAS",
            "total": "TOTAL",
            "checkout": "PAGAR",
            "add-cart": "AÑADIR AL CARRITO"
        },
        "ja": {
            "hero-title": "SCENT THE STREET",
            "hero-sub": "ストリートの香り、ルールなし",
            "products-title": "フレグランスコレクション",
            "total": "合計",
            "checkout": "レジへ",
            "add-cart": "カートに追加"
        },
        "ko": {
            "hero-title": "SCENT THE STREET",
            "hero-sub": "스트리트 향, 규칙 없음",
            "products-title": "향수 컬렉션",
            "total": "총액",
            "checkout": "결제하기",
            "add-cart": "장바구니에 추가"
        }
    };

    // 更新多语言
    function updateI18n() {
        const lang = document.getElementById('langSelect').value;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.textContent = i18n[lang][key];
        });
    }

    // 语言切换事件
    document.getElementById('langSelect').addEventListener('change', updateI18n);

    // 初始化
    renderProducts();
</script>

</body>
</html>
