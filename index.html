<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCENT MODE - 潮牌香水</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body {
            background: #121212;
            color: white;
            padding-bottom: 100px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            background: #121212;
            z-index: 999;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff0080, #00ffff);
            -webkit-background-clip: text;
            color: transparent;
        }
        .lang-group select {
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .cart-icon {
            font-size: 20px;
            cursor: pointer;
            position: relative;
        }
        #cartCount {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff3366;
            color: white;
            font-size: 12px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .product {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }
        .product:hover {
            transform: translateY(-4px);
        }
        .product img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background: #222;
        }
        .product-info {
            padding: 14px;
        }
        .product-name {
            font-size: 15px;
            margin-bottom: 6px;
        }
        .price {
            color: #00ffff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .add-cart {
            background: linear-gradient(90deg, #ff0080, #ff4400);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
        .cart {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            padding: 16px 20px;
            border-top: 1px solid #333;
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
        }
        .contact {
            margin-top: 40px;
            text-align: center;
            color: #aaa;
        }
        .contact a {
            color: #00ffaa;
            text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">SCENT MODE 【你的LOGO位】</div>
    <div class="lang-group">
        <select id="langSelect">
            <option value="zh-HK">繁體</option>
            <option value="zh-CN">简体</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="it">Italiano</option>
        </select>
    </div>
    <div class="cart-icon">🛒 <span id="cartCount">0</span></div>
</header>

<div class="container">
    <div class="products" id="products">
        <!-- 10款产品会由JS自动生成 -->
    </div>
</div>

<div class="cart">
    <div class="cart-total">
        <span data-i18n="total">總金額</span>
        <span>HKD $<span id="totalPrice">0</span></span>
    </div>
</div>

<div class="contact">
    <p>WhatsApp: <a href="https://wa.me/85291257354" target="_blank">9125 7354</a></p>
    <p>Email: contact@scentmode.com</p>
</div>

<script>
    // 10款香水产品
    const products = [
        { id:1, name:"Shadow Wood", price:399, img:"https://picsum.photos/400/600" },
        { id:2, name:"Ocean Breeze", price:369, img:"https://picsum.photos/400/601" },
        { id:3, name:"Midnight Pulse", price:429, img:"https://picsum.photos/400/602" },
        { id:4, name:"Urban Street", price:379, img:"https://picsum.photos/400/603" },
        { id:5, name:"Pink Rebel", price:389, img:"https://picsum.photos/400/604" },
        { id:6, name:"Smoke Signature", price:459, img:"https://picsum.photos/400/605" },
        { id:7, name:"Citrus Flash", price:349, img:"https://picsum.photos/400/606" },
        { id:8, name:"Leather Code", price:419, img:"https://picsum.photos/400/607" },
        { id:9, name:"Night Walker", price:439, img:"https://picsum.photos/400/608" },
        { id:10, name:"Pure Raw", price:359, img:"https://picsum.photos/400/609" }
    ];

    // 购物车
    let cart = [];
    const productsEl = document.getElementById('products');
    const cartCountEl = document.getElementById('cartCount');
    const totalPriceEl = document.getElementById('totalPrice');

    // 渲染产品
    function renderProducts() {
        productsEl.innerHTML = '';
        products.forEach(p => {
            const div = document.createElement('div');
            div.className = 'product';
            div.innerHTML = `
                <img src="${p.img}" alt="${p.name}">
                <div class="product-info">
                    <div class="product-name">${p.name}</div>
                    <div class="price">$${p.price}</div>
                    <button class="add-cart" onclick="addToCart(${p.id})">加入購物車</button>
                </div>
            `;
            productsEl.appendChild(div);
        });
    }

    // 加入购物车
    function addToCart(id) {
        const item = products.find(x => x.id === id);
        cart.push(item);
        updateCart();
    }

    // 更新购物车
    function updateCart() {
        cartCountEl.innerText = cart.length;
        const total = cart.reduce((sum, i) => sum + i.price, 0);
        totalPriceEl.innerText = total;
    }

    // 多语言翻译
    const i18n = {
        "zh-HK": { total:"總金額" },
        "zh-CN": { total:"总金额" },
        "en": { total:"Total" },
        "fr": { total:"Total" },
        "ja": { total:"合計" },
        "ko": { total:"총 금액" },
        "es": { total:"Total" },
        "it": { total:"Totale" }
    };

    document.getElementById('langSelect').addEventListener('change', function(e) {
        const lang = e.target.value;
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.innerText = i18n[lang][key];
        });
    });

    renderProducts();
</script>

</body>
</html>
