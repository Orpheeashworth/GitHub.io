<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
:root {
    --bg-main: #0a0a0d;
    --bg-card: #14141a;
    --accent-neon: #ff3a3a;
    --accent-hk: #ff6b00;
    --text-primary: #f0f0f0;
    --text-secondary: #a0a0a8;
    --border: #2a2a33;
    --glow: 0 0 15px rgba(255, 58, 58, 0.4);
}
body {
    background: var(--bg-main);
    color: var(--text-primary);
    background-image: linear-gradient(rgba(10,10,13,0.95), rgba(10,10,13,0.98)), url('https://picsum.photos/1920/1080?grayscale&blur=2');
    background-attachment: fixed;
    line-height: 1.5;
    padding-bottom: 120px;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 30px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(10,10,13,0.95);
    backdrop-filter: blur(8px);
    z-index: 999;
}
.logo {
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -1px;
    color: var(--text-primary);
    text-shadow: var(--glow);
}
.header-right {
    display: flex;
    align-items: center;
    gap: 25px;
}
.lang-select {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 0;
    text-transform: uppercase;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s;
}
.lang-select:hover {
    border-color: var(--accent-neon);
    box-shadow: var(--glow);
}
.cart-icon {
    font-size: 24px;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s;
}
.cart-icon:hover {
    transform: scale(1.1);
}
#cartCount {
    position: absolute;
    top: -8px;
    right: -8px;
    background: var(--accent-neon);
    color: #fff;
    font-size: 11px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    box-shadow: var(--glow);
}
.filter-wrap {
    max-width: 1400px;
    margin: 30px auto 0;
    padding: 0 30px;
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
}
.filter-btn {
    padding: 14px 30px;
    background: transparent;
    border: 2px solid var(--accent-neon);
    color: var(--text-primary);
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    min-width: 180px;
    text-align: center;
    outline: none;
}
.filter-btn.active, .filter-btn:hover {
    background: var(--accent-neon);
    color: #000;
    box-shadow: var(--glow);
    border-color: var(--accent-neon);
}
.hero {
    width: 100%;
    height: 80vh;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://picsum.photos/id/1067/1920/1080?grayscale');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30%;
    background: linear-gradient(transparent, var(--bg-main));
}
.hero-text {
    z-index: 2;
}
.hero h1 data-i18n="hero-title">orphee ashworth</h1>
<p data-i18n="hero-sub">香港香氛選物店，嚴選全球靚貨</p>
</div>

</div>

</div>
<button class="checkout-btn" data-i18n="checkout" onclick="sendWhatsAppOrder()">立即結賬</button>
</div>

<div class="contact">

<p>&copy; 2026 orphee ashworth. 香港香氛選物店.</p>
</div>

<script>
const products = [

    { id: 1, name: "廢墟工廠木質調", price: 499, img: "https://picsum.photos/500/700?random=1", cat: "street" },
    { id: 2, name: "霓虹暗巷煙燻調", price: 469, img: "https://picsum.photos/500/700?random=2", cat: "street" },

    { id: 15, name: "香草廢墟溫潤調", price: 519, img: "https://picsum.photos/id/1009/500/700", cat: "plant" },
    { id: 16, name: "舊街榕樹木質調", price: 509, img: "https://picsum.photos/id/1011/500/700", cat: "plant" },
    { id: 17, name: "霓虹花叢花果調", price: 489, img: "https://picsum.photos/id/1012/500/700", cat: "plant" },
    { id: 18, name: "廢墟竹林青竹調", price: 469, img: "https://picsum.photos/id/1013/500/700", cat: "plant" },
    { id: 19, name: "天台花園茉莉調", price: 499, img: "https://picsum.photos/id/1014/500/700", cat: "plant" },
    { id: 20, name: "塗鴉牆邊薰衣草調", price: 479, img: "https://picsum.photos/id/1015/500/700", cat: "plant" },
    { id: 21, name: "舊茶餐廳桂花調", price: 459, img: "https://picsum.photos/id/1016/500/700", cat: "plant" },
    { id: 22, name: "廢棄碼頭海藻調", price: 449, img: "https://picsum.photos/id/1017/500/700", cat: "street" },
    { id: 23, name: "街頭仙人掌辛辣調", price: 529, img: "https://picsum.photos/id/1018/500/700", cat: "street" },
    { id: 24, name: "午夜花園夜來香調", price: 539, img: "https://picsum.photos/id/1019/500/700", cat: "plant" },
    { id: 25, name: "都市森林松針調", price: 519, img: "https://picsum.photos/id/1020/500/700", cat: "plant" },
    // 新增爱马仕礼盒
    { id: 26, name: "HERMÈS 愛馬仕 EAU DES MERVEILLES 奇跡之水禮盒", price: 999, img: "https://i.imgur.com/your-image-link.jpg", cat: "plant" }
];

let cart = [];
let currentFilter = "all";
const productsEl = document.getElementById('productsList');
const cartCountEl = document.getElementById('cartCount');
const totalPriceEl = document.getElementById('totalPrice');
const langSelectEl = document.getElementById('langSelect');

const i18n = {
    "zh-HK": {
        "hero-title": "orphee ashworth",
        "hero-sub": "香港香氛選物店，嚴選全球靚貨",
        "products-title": "香水系列",
        "total": "總金額",
        "checkout": "立即結賬",
        "add-cart": "加入購物車",
        "empty-cart": "購物車暫無商品"
    },
    "zh-CN": {
        "hero-title": "orphee ashworth",
        "hero-sub": "香港香氛选物店，严选全球好货",
        "products-title": "香水系列",
        "total": "总金额",
        "checkout": "立即结账",
        "add-cart": "加入购物车",
        "empty-cart": "购物车暂无商品"
    },
    "en": {
        "hero-title": "orphee ashworth",
        "hero-sub": "Hong Kong Fragrance Select Shop, Curated Global Goods",
        "products-title": "FRAGRANCE COLLECTION",
        "total": "TOTAL",
        "checkout": "CHECKOUT",
        "add-cart": "ADD TO CART",
        "empty-cart": "Cart is empty"
    }
};

function renderProducts() {
    productsEl.innerHTML = '';
    const filteredProducts = currentFilter === "all" ? products : products.filter(p => p.cat === currentFilter);
    const currentLang = langSelectEl.value;
    
    filteredProducts.forEach(p => {
        const productCard = document.createElement('div');
        productCard.className = 'product';
        productCard.innerHTML = `
            <img src="${p.img}" alt="${p.name}" class="product-img">
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="price">$${p.price}</div>
                <button class="add-cart" onclick="addToCart(${p.id})" data-i18n="add-cart">${i18n[currentLang]["add-cart"]}</button>
            </div>
        `;
        productsEl.appendChild(productCard);
    });
    updateI18n();
}

window.addToCart = function(id) {
    const item = products.find(p => p.id === id);
    if (!item) return;
    cart.push(item);
    updateCart();
};

function updateCart() {
    cartCountEl.textContent = cart.length;
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    totalPriceEl.textContent = total;
}

function updateI18n() {
    const currentLang = langSelectEl.value;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = i18n[currentLang][key];
    });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderProducts();
    });
});

window.sendWhatsAppOrder = function() {
    const currentLang = langSelectEl.value;
    if (cart.length === 0) {
        alert(i18n[currentLang]["empty-cart"]);
        return;
    }
    let msg = `${i18n[currentLang]["checkout"]}:\n`;
    cart.forEach((item, index) => {
        msg += `${index + 1}. ${item.name} | HKD $${item.price}\n`;
    });
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    msg += `\n${i18n[currentLang]["total"]}: HKD $${total}`;
    window.open(`https://wa.me/85291257354?text=${encodeURIComponent(msg)}`);
};

langSelectEl.addEventListener('change', () => {
    updateI18n();
    renderProducts();
});

renderProducts();
updateCart();
updateI18n();
</script>
