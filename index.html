<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>Orphee & Ashworth Perfume</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: url('images/hero-bg.jpg') no-repeat center center/cover;
      animation: fadeIn 2s ease;
      color: #fff;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    header {
      text-align: center;
      padding: 100px 20px 40px;
      background: rgba(0,0,0,0.4);
    }
    header h1 { font-size: 48px; margin-bottom: 10px; }
    header p { font-size: 20px; margin-bottom: 20px; }
    .lang-switch { position: absolute; top: 20px; right: 20px; }
    .lang-switch button {
      margin-left: 10px; padding: 5px 10px;
      background: #fff; color: #333;
      border: none; border-radius: 5px; cursor: pointer;
    }
    .product-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 20px; padding: 40px; background: #fff; color: #333;
    }
    .product {
      background: #f9f9f9; padding: 20px; border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
      text-align: center; transition: transform 0.3s ease;
    }
    .product:hover { transform: scale(1.05); }
    .product img { max-width: 100%; border-radius: 8px; margin-bottom: 10px; }
    footer { background: #eee; text-align: center; padding: 20px; }
    .payments img { height: 24px; margin: 0 5px; }
    .whatsapp { position: fixed; bottom: 20px; right: 20px; }
    .whatsapp img { height: 48px; }
  </style>
</head>
<body>
  <div class="lang-switch">
    <button>中文</button>
    <button>English</button>
  </div>

  <header>
    <h1>Orphee & Ashworth Perfume</h1>
    <p>香港文化 × 歐洲美學</p>
  </header>

  <section class="product-grid">
    <div class="product">
      <img src="images/product1.jpg" alt="Perfume 1">
      <h2>香水一號</h2>
      <p>優雅花香調</p>
    </div>
    <div class="product">
      <img src="images/product2.jpg" alt="Perfume 2">
      <h2>香水二號</h2>
      <p>清新果香調</p>
    </div>
    <div class="product">
      <img src="images/product3.jpg" alt="Perfume 3">
      <h2>香水三號</h2>
      <p>神秘木質調</p>
    </div>
  </section>

  <footer>
    <p>© 2026 Orphee & Ashworth Perfume</p>
    <div class="payments">
      <img src="images/visa.png" alt="Visa">
      <img src="images/mastercard.png" alt="MasterCard">
      <img src="images/paypal.png" alt="PayPal">
      <img src="images/alipay.png" alt="Alipay">
      <img src="images/wechatpay.png" alt="WeChat Pay">
    </div>
  </footer>

  <div class="whatsapp">
    <a href="https://wa.me/85260000000" target="_blank">
      <img src="images/whatsapp.png" alt="WhatsApp">
    </a>
  </div>
</body>
</html>
