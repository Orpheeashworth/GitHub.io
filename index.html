<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>orphee ashworth - 香水</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
:root {
    --bg-main: #0a0a0d;
    --bg-card: #14141a;
    --accent-neon: #ff3a3a;
    --accent-hk: #ff6b00;
    --text-primary: #f0f0f0;
    --text-secondary: #a0a0a8;
    --border: #2a2a33;
    --glow: 0 0 15px rgba(255, 58, 58, 0.4);
}
body {
    background: var(--bg-main);
    color: var(--text-primary);
    background-image: linear-gradient(rgba(10,10,13,0.95), rgba(10,10,13,0.98)), url('https://picsum.photos/1920/1080?grayscale&blur=2');
    background-attachment: fixed;
    line-height: 1.5;
    padding-bottom: 120px;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 30px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(10,10,13,0.95);
    backdrop-filter: blur(8px);
    z-index: 999;
}
.logo {
    font-size: 30px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -1px;
    color: var(--text-primary);
    text-shadow: var(--glow);
}
.header-right {
    display: flex;
    align-items: center;
    gap: 25px;
}
.lang-select {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 0;
    text-transform: uppercase;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s;
}
.lang-select:hover {
    border-color: var(--accent-neon);
    box-shadow: var(--glow);
}
.cart-icon {
    font-size: 24px;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s;
}
.cart-icon:hover {
    transform: scale(1.1);
}
#cartCount {
    position: absolute;
    top: -8px;
    right: -8px;
    background: var(--accent-neon);
    color: #fff;
    font-size: 11px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    box-shadow: var(--glow);
}
#cartCount.pulse {
    animation: pulse 0.25s ease;
}
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.25); }
    100% { transform: scale(1); }
}
.filter-wrap {
    max-width: 1400px;
    margin: 30px auto 0;
    padding: 0 30px;
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
}
.filter-btn {
    padding: 14px 30px;
    background: transparent;
    border: 2px solid var(--accent-neon);
    color: var(--text-primary);
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    min-width: 180px;
    text-align: center;
    outline: none;
}
.filter-btn.active, .filter-btn:hover {
    background: var(--accent-neon);
    color: #000;
    box-shadow: var(--glow);
    border-color: var(--accent-neon);
}
.hero {
    width: 100%;
    height: 80vh;
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://picsum.photos/id/1067/1920/1080?grayscale');
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30%;
    background: linear-gradient(transparent, var(--bg-main));
}
.hero-text {
    z-index: 2;
}
.hero h1 {
    font-size: 7vw;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -3px;
    margin-bottom: 15px;
    line-height: 1;
    text-shadow: 0 0 20px rgba(255, 107, 0, 0.6);
}
.hero p {
    font-size: 1.8vw;
    text-transform: uppercase;
    letter-spacing: 4px;
    opacity: 0.9;
    color: var(--accent-hk);
}
.container {
    max-width: 1400px;
    margin: 40px auto;
    padding: 0 30px;
}
.section-title {
    font-size: 32px;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    letter-spacing: 1px;
}
.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 35px;
}
.product {
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: all 0.4s ease;
    overflow: hidden;
    position: relative;
}
.product::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent-neon), var(--accent-hk));
    transform: scaleX(0);
    transition: transform 0.4s;
}
.product:hover::before {
    transform: scaleX(1);
}
.product:hover {
    transform: translateY(-8px);
    border-color: var(--accent-neon);
    box-shadow: 0 10px 30px rgba(255, 58, 58, 0.2);
}
.product-img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    background: #1a1a1a;
    filter: grayscale(30%) contrast(1.2);
    transition: filter 0.4s;
}
.product:hover .product-img {
    filter: grayscale(0%) contrast(1.1);
}
.product-info {
    padding: 20px;
}
.product-name {
    font-size: 17px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 10px;
    letter-spacing: 0.8px;
}
.price {
    font-size: 20px;
    font-weight: 900;
    color: var(--accent-neon);
    margin-bottom: 15px;
}
.add-cart {
    width: 100%;
    padding: 12px;
    background: transparent;
    color: var(--text-primary);
    border: 1px solid var(--accent-neon);
    font-weight: 900;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.3s;
}
.add-cart:hover {
    background: var(--accent-neon);
    color: var(--bg-main);
    box-shadow: var(--glow);
}
.payment-section {
    max-width: 1400px;
    margin: 50px auto 0;
    padding: 0 30px;
    text-align: center;
}
.payment-icons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
}
.payment-icon {
    width: 72px;
    height: 48px;
    object-fit: contain;
    display: block;
    background: transparent;
    filter: none;
    transition: transform 0.25s ease, opacity 0.25s ease;
}
.payment-icon:hover {
    transform: translateY(-3px) scale(1.05);
    opacity: 0.95;
}
.cart-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(20,20,26,0.95);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 998;
}
.cart-total {
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
}
.checkout-btn {
    padding: 12px 30px;
    background: linear-gradient(90deg, var(--accent-neon), var(--accent-hk));
    color: var(--text-primary);
    border: none;
    font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: var(--glow);
}
.checkout-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(255, 58, 58, 0.6);
}
.contact {
    max-width: 1400px;
    margin: 70px auto 0;
    padding: 0 30px 50px;
    border-top: 1px solid var(--border);
    padding-top: 50px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 15px;
}
.contact a {
    color: var(--accent-hk);
    text-decoration: none;
    font-weight: 700;
    transition: all 0.3s;
}
.contact a:hover {
    color: var(--accent-neon);
    text-shadow: var(--glow);
}
@media(max-width: 768px) {
    .hero h1 {
        font-size: 12vw;
    }
    .hero p {
        font-size: 4vw;
    }
    .products {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }
    .filter-wrap {
        gap: 15px;
        padding: 0 15px;
    }
    .filter-btn {
        padding: 12px 20px;
        font-size: 13px;
        min-width: 140px;
    }
    header {
        padding: 15px 20px;
    }
    .payment-icons {
        gap: 14px;
    }
    .payment-icon {
        width: 62px;
        height: 40px;
    }
}
</style>
</head>

    { id: 13, name: "玫瑰廢墟馥郁調", price: 559, img: "https://picsum.photos/id/1007/500/700", cat: "plant" },
    { id: 14, name: "茶園霧氣綠調", price: 479, img: "https://picsum.photos/id/1008/500/700", cat: "plant" },
    { id: 15, name: "香草廢墟溫潤調", price: 519, img: "https://picsum.photos/id/1009/500/700", cat: "plant" },
    { id: 16, name: "舊街榕樹木質調", price: 509, img: "https://picsum.photos/id/1011/500/700", cat: "plant" },
    { id: 17, name: "霓虹花叢花果調", price: 489, img: "https://picsum.photos/id/1012/500/700", cat: "plant" },
    { id: 18, name: "廢墟竹林青竹調", price: 469, img: "https://picsum.photos/id/1013/500/700", cat: "plant" },
    { id: 19, name: "天台花園茉莉調", price: 499, img: "https://picsum.photos/id/1014/500/700", cat: "plant" },
    { id: 20, name: "塗鴉牆邊薰衣草調", price: 479, img: "https://picsum.photos/id/1015/500/700", cat: "plant" },
    { id: 21, name: "舊茶餐廳桂花調", price: 459, img: "https://picsum.photos/id/1016/500/700", cat: "plant" },
    { id: 24, name: "午夜花園夜來香調", price: 539, img: "https://picsum.photos/id/1019/500/700", cat: "plant" },
    { id: 25, name: "都市森林松針調", price: 519, img: "https://picsum.photos/id/1020/500/700", cat: "plant" },
    { id: 26, name: "Diptyque 蒂普提克 L'Eau Papier（纸墨之水）淡香水 100ml/3.4oz 重量: 0.30KG", price: 1320, img: "https://i.ibb.co/pv3R98Kk/你的香水相.jpg",cat: "plant"},
    { id: 27, name: "Christian Dior 迪奥MISS DIOR BLOOMING BOUQUET 淡香薰 5ml/0.17oz 重量: 0.04KG", price: 164, img: "https://i.ibb.co/21hstk0V/你的香水相.jpg",cat: "plant"},
];
let cart = [];
let currentFilter = "all";
const productsEl = document.getElementById('productsList');
const cartCountEl = document.getElementById('cartCount');
const totalPriceEl = document.getElementById('totalPrice');
const langSelectEl = document.getElementById('langSelect');

const i18n = {
    "zh-HK": {"hero-title":"SCENT THE CITY","hero-sub":"氣味無界","products-title":"香水系列","total":"總金額","checkout":"立即結賬","add-cart":"加入購物車","empty-cart":"購物車暫無商品"},
    "zh-CN": {"hero-title":"SCENT THE CITY","hero-sub":"气味无界","products-title":"香水系列","total":"总金额","checkout":"立即结账","add-cart":"加入购物车","empty-cart":"购物车暂无商品"},
    "en": {"hero-title":"SCENT THE CITY","hero-sub":"URBAN RUIN, UNBOUND SCENT","products-title":"FRAGRANCE COLLECTION","total":"TOTAL","checkout":"CHECKOUT","add-cart":"ADD TO CART","empty-cart":"Cart is empty"},
    "fr": {"hero-title":"SCENT THE CITY","hero-sub":"RUIN URBAINE, PARFUM SANS LIMITE","products-title":"COLLECTION PARFUM","total":"TOTAL","checkout":"PAYER","add-cart":"AJOUTER AU PANIER","empty-cart":"Panier vide"},
    "it": {"hero-title":"SCENT THE CITY","hero-sub":"ROVINA URBANA, PROFUMO SENZA LIMITI","products-title":"COLLEZIONE PROFUMI","total":"TOTALE","checkout":"PAGA","add-cart":"AGGIUNGI AL CARRELLO","empty-cart":"Carrello vuoto"},
    "es": {"hero-title":"SCENT THE CITY","hero-sub":"RUINA URBANA, FRAGANCIA SIN LÍMITES","products-title":"COLECCIÓN FRAGANCIAS","total":"TOTAL","checkout":"PAGAR","add-cart":"AÑADIR AL CARRITO","empty-cart":"Carrito vacío"},
    "ja": {"hero-title":"SCENT THE CITY","hero-sub":"都会の廃墟、限りなき香り","products-title":"フレグランスコレクション","total":"合計","checkout":"レジへ","add-cart":"カートに追加","empty-cart":"カートが空です"},
    "ko": {"hero-title":"SCENT THE CITY","hero-sub":"도시 폐허, 경계 없는 향기","products-title":"향수 컬렉션","total":"총액","checkout":"결제하기","add-cart":"장바구니에 추가","empty-cart":"장바구니가 비었습니다"},
    "th": {"hero-title":"SCENT THE CITY","hero-sub":"ความหายนะในเมือง กลิ่นที่ไร้ขีดจำกัด","products-title":"คอลเลกชันน้ำหอม","total":"ยอดรวม","checkout":"ชำระเงิน","add-cart":"ใส่ตะกร้า","empty-cart":"ตะกร้าว่างเปล่า"},
    "de": {"hero-title":"SCENT THE CITY","hero-sub":"URBANE RUINE, GRENZENLOSE DÜFTE","products-title":"DUFTKOLLEKTION","total":"GESAMT","checkout":"ZUR KASSE","add-cart":"IN WARENKORB","empty-cart":"Warenkorb ist leer"}
};

function renderProducts() {
    productsEl.innerHTML = '';
    const filteredProducts = currentFilter === "all" ? products : products.filter(p => p.cat === currentFilter);
    const currentLang = langSelectEl.value;

    filteredProducts.forEach(p => {
        const productCard = document.createElement('div');
        productCard.className = 'product';
        productCard.innerHTML = `
            <img src="${p.img}" alt="${p.name}" class="product-img">
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="price">HKD $${p.price}</div>
                <button class="add-cart" onclick="addToCart(${p.id})">${i18n[currentLang]["add-cart"]}</button>
            </div>
        `;
        productsEl.appendChild(productCard);
    });
    updateI18n();
}

window.addToCart = function(id) {
    const item = products.find(p => p.id === id);
    if (!item) return;

    const existing = cart.find(x => x.id === id);
    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({ ...item, qty: 1 });
    }

    updateCart();
};

function updateCart() {
    const itemCount = cart.reduce((sum, item) => sum + item.qty, 0);
    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

    cartCountEl.textContent = itemCount;
    totalPriceEl.textContent = total.toFixed(0);

    cartCountEl.classList.remove('pulse');
    void cartCountEl.offsetWidth;
    cartCountEl.classList.add('pulse');
}

function updateI18n() {
    const currentLang = langSelectEl.value;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = i18n[currentLang][key];
    });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderProducts();
    });
});

window.sendWhatsAppOrder = function() {
    const currentLang = langSelectEl.value;
    if (cart.length === 0) {
        alert(i18n[currentLang]["empty-cart"]);
        return;
    }

    let msg = `${i18n[currentLang]["checkout"]}:
`;
    cart.forEach((item, index) => {
        msg += `${index + 1}. ${item.name} x${item.qty} | HKD $${item.price * item.qty}
`;
    });

    const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
    msg += `
${i18n[currentLang]["total"]}: HKD $${total}`;

    window.open(`https://wa.me/85290475370?text=${encodeURIComponent(msg)}`);
};

langSelectEl.addEventListener('change', () => {
    updateI18n();
    renderProducts();
});

renderProducts();
updateCart();
updateI18n();
</script>

</html>
