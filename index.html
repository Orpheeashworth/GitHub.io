<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URBAN SCENT  香水</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
:root {
    --bg-main: #0a0a0d;
    --bg-card: #14141a;
    --accent-neon: #ff3a3a;
    --accent-hk: #ff6b00;
    --text-primary: #f0f0f0;
    --text-secondary: #a0a0a8;
    --border: #2a2a33;
    --glow: 0 0 15px rgba(255, 58, 58, 0.4);
}
body {
    background: var(--bg-main);
    color: var(--text-primary);
    background-image: linear-gradient(rgba(10,10,13,0.95), rgba(10,10,13,0.98)), url('https://picsum.photos/1920/1080?grayscale&blur=2');
    background-attachment: fixed;
    line-height: 1.5;
    padding-bottom: 120px;
}
header {
    display:flex;justify-content:space-between;align-items:center;padding:18px 30px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(10,10,13,0.95);backdrop-filter:blur(8px);z-index:999;
}
.logo {font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:-1px;color:var(--text-primary);text-shadow:var(--glow);}
.header-right {display:flex;align-items:center;gap:25px;}
.lang-select {background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);padding:6px 12px;border-radius:0;text-transform:uppercase;font-size:12px;cursor:pointer;transition:all 0.3s;}
.lang-select:hover {border-color:var(--accent-neon);box-shadow:var(--glow);}
.cart-icon {font-size:24px;cursor:pointer;position:relative;}
#cartCount {position:absolute;top:-8px;right:-8px;background:var(--accent-neon);color:#fff;font-size:11px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;}
/* 分类筛选按钮样式 */
.filter-wrap{max-width:1400px;margin:30px auto 0;padding:0 30px;display:flex;gap:15px;flex-wrap:center;}
.filter-btn{padding:10px 20px;background:transparent;border:1px solid var(--accent-neon);color:var(--text-primary);text-transform:uppercase;cursor:pointer;transition:0.3s;}
.filter-btn.active,.filter-btn:hover{background:var(--accent-neon);color:#000;}
.hero {width:100%;height:80vh;background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.9)),url('https://picsum.photos/id/1067/1920/1080?grayscale');background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;}
.hero::after {content:'';position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(transparent,var(--bg-main));}
.hero-text {z-index:2;}
.hero h1 {font-size:7vw;font-weight:900;text-transform:uppercase;letter-spacing:-3px;margin-bottom:15px;line-height:1;}
.hero p {font-size:1.8vw;text-transform:uppercase;letter-spacing:4px;opacity:0.9;color:var(--accent-hk);}
.container {max-width:1400px;margin:40px auto;padding:0 30px;}
.section-title {font-size:32px;font-weight:900;text-transform:uppercase;margin-bottom:20px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.products {display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:35px;}
.product {background:var(--bg-card);border:1px solid var(--border);transition:all 0.4s ease;overflow:hidden;position:relative;}
.product:hover {transform:translateY(-8px);border-color:var(--accent-neon);}
.product-img {width:100%;height:350px;object-fit:cover;filter:grayscale(30%) contrast(1.2);}
.product-info {padding:20px;}
.product-name {font-size:17px;font-weight:700;text-transform:uppercase;margin-bottom:10px;}
.price {font-size:20px;font-weight:900;color:var(--accent-neon);margin-bottom:15px;}
.add-cart {width:100%;padding:12px;background:transparent;color:var(--text-primary);border:1px solid var(--accent-neon);font-weight:900;text-transform:uppercase;font-size:12px;cursor:pointer;}
.add-cart:hover {background:var(--accent-neon);color:#000;}
.payment-section {max-width:1400px;margin:50px auto 0;padding:0 30px;text-align:center;}
.payment-icons {display:flex !important;justify-content:center !important;gap:30px !important;flex-wrap:wrap !important;}
.payment-icon {height:48px !important;width:auto !important;}
.cart-bar {position:fixed;bottom:0;left:0;right:0;background:rgba(20,20,26,0.95);border-top:1px solid var(--border);padding:18px 30px;display:flex;justify-content:space-between;align-items:center;z-index:998;}
.cart-total {font-size:20px;font-weight:900;text-transform:uppercase;}
.checkout-btn {padding:12px 30px;background:linear-gradient(90deg,var(--accent-neon),var(--accent-hk));color:#fff;border:none;font-weight:900;text-transform:uppercase;cursor:pointer;}
.contact {max-width:1400px;margin:70px auto 0;padding:0 30px 50px;border-top:1px solid var(--border);padding-top:50px;text-align:center;color:var(--text-secondary);font-size:15px;}
.contact a {color:var(--accent-hk);text-decoration:none;font-weight:700;}
@media(max-width:768px){
.hero h1{font-size:12vw;}
.hero p{font-size:4vw;}
.products{grid-template-columns:repeat(2,1fr);gap:20px;}
.filter-wrap{gap:8px;}
.filter-btn{padding:8px 12px;font-size:12px;}
}
</style>
</head>
<body>
<header>
<div class="logo">URBAN SCENT</div>
<div class="header-right">
<select class="lang-select" id="langSelect">
<option value="zh-HK" selected>繁體</option>
<option value="zh-CN">简体</option>
<option value="en">English</option>
</select>
<div class="cart-icon">🛒 <span id="cartCount">0</span></div>
</div>
</header>

<section class="hero">
<div class="hero-text">
<h1>SCENT THE CITY</h1>
<p>氣味無界</p>
</div>
</section>

<!-- 分类筛选按钮：全部 / 街頭調 / 植物調 -->
<div class="filter-wrap">
<button class="filter-btn active" data-filter="all">全部產品</button>
<button class="filter-btn" data-filter="street">街頭廢土調</button>
<button class="filter-btn" data-filter="plant">植物清香調</button>
</div>

<div class="container">
<h2 class="section-title">香水系列</h2>
<div class="products" id="productsList"></div>
</div>

<div class="payment-section">
<div class="payment-icons">
<img src="https://img.icons8.com/fluency/96/visa.png" class="payment-icon" alt="Visa">
<img src="https://img.icons8.com/fluency/96/mastercard.png" class="payment-icon" alt="Mastercard">
<img src="https://img.icons8.com/fluency/96/alipay.png" class="payment-icon" alt="支付宝">
<img src="https://img.icons8.com/fluency/96/wechat-pay.png" class="payment-icon" alt="微信支付">
</div>
</div>

<div class="cart-bar">
<div class="cart-total">總金額: HKD $<span id="totalPrice">0</span></div>
<button class="checkout-btn" onclick="sendWhatsAppOrder()">立即結賬</button>
</div>

<div class="contact">
<p>WhatsApp: <a href="https://wa.me/85290475370" target="_blank">+852 9047 5370</a></p>
<p>Email: <a href="mailto:Orphee.ashworth1@gmail.com">Orphee.ashworth1@gmail.com</a></p>
<p>&copy; 2016 URBAN SCENT</p>
</div>

<script>
const products = [
{id:1,name:"廢墟工廠木質調",price:499,img:"https://picsum.photos/500/700?random=1",cat:"street"},
{id:2,name:"霓虹暗巷煙燻調",price:469,img:"https://picsum.photos/500/700?random=2",cat:"street"},
{id:3,name:"天台雨夜冷調",price:449,img:"https://picsum.photos/500/700?random=3",cat:"street"},
{id:4,name:"塗鴉巷弄柑橘調",price:429,img:"https://picsum.photos/500/700?random=4",cat:"street"},
{id:5,name:"朋克鉚釘皮革調",price:529,img:"https://picsum.photos/500/700?random=5",cat:"street"},
{id:6,name:"舊茶餐廳檀木調",price:479,img:"https://picsum.photos/500/700?random=6",cat:"street"},
{id:7,name:"廢棄碼頭鹹香調",price:459,img:"https://picsum.photos/500/700?random=7",cat:"street"},
{id:8,name:"街頭叛逆烏木調",price:549,img:"https://picsum.photos/500/700?random=8",cat:"street"},
{id:9,name:"午夜巷弄琥珀調",price:489,img:"https://picsum.photos/500/700?random=9",cat:"street"},
{id:10,name:"都市原始生薑調",price:519,img:"https://picsum.photos/500/700?random=10",cat:"street"},
{id:11,name:"叢林深處雪松調",price:539,img:"https://picsum.photos/id/1005/500/700",cat:"plant"},
{id:12,name:"白苔森林清新調",price:499,img:"https://picsum.photos/id/1006/500/700",cat:"plant"},
{id:13,name:"玫瑰廢墟馥郁調",price:559,img:"https://picsum.photos/id/1007/500/700",cat:"plant"},
{id:14,name:"茶園霧氣綠調",price:479,img:"https://picsum.photos/id/1008/500/700",cat:"plant"},
{id:15,name:"香草廢墟溫潤調",price:519,img:"https://picsum.photos/id/1009/500/700",cat:"plant"},
{id:16,name:"舊街榕樹木質調",price:509,img:"https://picsum.photos/id/1011/500/700",cat:"plant"},
{id:17,name:"霓虹花叢花果調",price:489,img:"https://picsum.photos/id/1012/500/700",cat:"plant"},
{id:18,name:"廢墟竹林青竹調",price:469,img:"https://picsum.photos/id/1013/500/700",cat:"plant"},
{id:19,name:"天台花園茉莉調",price:499,img:"https://picsum.photos/id/1014/500/700",cat:"plant"},
{id:20,name:"塗鴉牆邊薰衣草調",price:479,img:"https://picsum.photos/id/1015/500/700",cat:"plant"},
{id:21,name:"舊茶餐廳桂花調",price:459,img:"https://picsum.photos/id/1016/500/700",cat:"plant"},
{id:22,name:"廢棄碼頭海藻調",price:449,img:"https://picsum.photos/id/1017/500/700",cat:"street"},
{id:23,name:"街頭仙人掌辛辣調",price:529,img:"https://picsum.photos/id/1018/500/700",cat:"street"},
{id:24,name:"午夜花園夜來香調",price:539,img:"https://picsum.photos/id/1019/500/700",cat:"plant"},
{id:25,name:"都市森林松針調",price:519,img:"https://picsum.photos/id/1020/500/700",cat:"plant"}
];

let cart = [];
let nowFilter = "all";
const productsEl = document.getElementById('productsList');
const cartCountEl = document.getElementById('cartCount');
const totalPriceEl = document.getElementById('totalPrice');

// 渲染分类产品
function renderProducts(){
    productsEl.innerHTML="";
    let list = nowFilter==="all" ? products : products.filter(x=>x.cat===nowFilter);
    list.forEach(p=>{
        let card = document.createElement("div");
        card.className="product";
        card.innerHTML=`
            <img src="${p.img}" class="product-img">
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="price">$${p.price}</div>
                <!-- 内联onclick，绝对绑定不失效 -->
                <button class="add-cart" onclick="strictAddCart(${p.id})">加入購物車</button>
            </div>
        `;
        productsEl.appendChild(card);
    });
}

// 【购物车终极强绑定函数，全局不丢、点击必生效】
window.strictAddCart = function(id){
    let item = products.find(x=>x.id===id);
    if(!item)return;
    cart.push(item);
    // 即时硬刷新DOM，绕过缓存bug
    let total = cart.reduce((sum,i)=>sum+i.price,0);
    cartCountEl.textContent = cart.length;
    totalPriceEl.textContent = total;
};

// 分类切换事件
document.querySelectorAll(".filter-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
        document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        nowFilter = btn.dataset.filter;
        renderProducts();
    });
});

// WhatsApp落单
window.sendWhatsAppOrder=function(){
    if(cart.length===0){alert("購物車暫無商品！");return;}
    let msg="落單訂單：\n";
    cart.forEach((it,idx)=>msg+=`${idx+1}. ${it.name} | HKD$${it.price}\n`);
    let all = cart.reduce((s,i)=>s+i.price,0);
    msg+=`\n總金額：HKD$${all}`;
    window.open("https://wa.me/85290475370?text="+encodeURIComponent(msg));
}

// 初始化载入
renderProducts();
cartCountEl.textContent="0";
totalPriceEl.textContent="0";
</script>
</body>
</html>
