<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">

<title>香水網店</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}
body{
  background:#fff;
  color:#000;
  padding-bottom:50px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
  border-bottom:1px solid #000;
  position:sticky;
  top:0;
  background:#fff;
  z-index:99;
}
.logo{
  font-size:22px;
  font-weight:bold;
}
.nav{
  display:flex;
  gap:12px;
}
.btn{
  padding:9px 14px;
  border:1px solid #000;
  background:#fff;
  border-radius:6px;
  cursor:pointer;
  transition:0.2s;
}
.btn:hover{
  background:#000;
  color:#fff;
}
.whatsapp-btn{
  background:#25D366;
  color:#fff;
  border-color:#25D366;
  font-weight:bold;
}
.whatsapp-btn:hover{
  background:#128C7E;
  color:#fff;
}
.container{
  max-width:1200px;
  margin:0 auto;
  padding:40px 20px;
}
.title{
  font-size:26px;
  text-align:center;
  margin-bottom:30px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:20px;
}
.card{
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  transition:0.3s;
}
.card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
}
.img{
  width:100%;
  height:200px;
  background:#f5f5f5;
  display:flex;
  align-items:center;
  justify-content:center;
}
.info{
  padding:15px;
  text-align:center;
}
.name{
  margin-bottom:10px;
  font-weight:bold;
}
.add{
  width:100%;
  padding:8px;
  border:1px solid #000;
  background:#fff;
  border-radius:6px;
  cursor:pointer;
}
.add:hover{
  background:#000;
  color:#fff;
}

@media(max-width:1000px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:600px){
  .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
