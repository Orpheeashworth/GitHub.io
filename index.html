<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URBAN SCENT - 香水</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        :root {
            --bg-main: #0a0a0d;
            --bg-card: #14141a;
            --accent-neon: #ff3a3a;
            --accent-hk: #ff6b00;
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a8;
            --border: #2a2a33;
            --glow: 0 0 15px rgba(255, 58, 58, 0.4);
        }
        body {
            background: var(--bg-main);
            color: var(--text-primary);
            background-image: 
                linear-gradient(rgba(10,10,13,0.95), rgba(10,10,13,0.98)),
                url('https://picsum.photos/1920/1080?grayscale&blur=2');
            background-attachment: fixed;
            line-height: 1.5;
            padding-bottom: 120px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(10,10,13,0.95);
            backdrop-filter: blur(8px);
            z-index: 999;
        }
        .logo {
            font-size: 30px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            color: var(--text-primary);
            text-shadow: var(--glow);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .lang-select {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 0;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .lang-select:hover {
            border-color: var(--accent-neon);
            box-shadow: var(--glow);
        }
        .cart-icon {
            font-size: 24px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }
        .cart-icon:hover {
            transform: scale(1.1);
        }
        #cartCount {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent-neon);
            color: var(--text-primary);
            font-size: 11px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: var(--glow);
        }
        .hero {
            width: 100%;
            height: 80vh;
            background: 
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
                url('https://picsum.photos/1920/1080?grayscale');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(transparent, var(--bg-main));
        }
        .hero-text {
            z-index: 2;
        }
        .hero h1 {
            font-size: 7vw;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -3px;
            margin-bottom: 15px;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.6);
        }
        .hero p {
            font-size: 1.8vw;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.9;
            color: var(--accent-hk);
        }
        .container {
            max-width: 1400px;
            margin: 70px auto;
            padding: 0 30px;
        }
        .section-title {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            letter-spacing: 1px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 35px;
        }
        .product {
            background: var(--bg-card);
            border: 1px solid var(--border);
            transition: all 0.4s ease;
            overflow: hidden;
            position: relative;
        }
        .product::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-hk));
            transform: scaleX(0);
            transition: transform 0.4s;
        }
        .product:hover::before {
            transform: scaleX(1);
        }
        .product:hover {
            transform: translateY(-8px);
            border-color: var(--accent-neon);
            box-shadow: 0 10px 30px rgba(255, 58, 58, 0.2);
        }
        .product-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            background: #1a1a1a;
            filter: grayscale(30%) contrast(1.2);
            transition: filter 0.4s;
        }
        .product:hover .product-img {
            filter: grayscale(0%) contrast(1.1);
        }
        .product-info {
            padding: 20px;
        }
        .product-name {
            font-size: 17px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 0.8px;
        }
        .price {
            font-size: 20px;
            font-weight: 900;
            color: var(--accent-neon);
            margin-bottom: 15px;
        }
        .add-cart {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--accent-neon);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .add-cart:hover {
            background: var(--accent-neon);
            color: var(--bg-main);
            box-shadow: var(--glow);
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,20,26,0.95);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--border);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 998;
        }
        .cart-total {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
        }
        .checkout-btn {
            padding: 12px 30px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-hk));
            color: var(--text-primary);
            border: none;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--glow);
        }
        .checkout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 58, 58, 0.6);
        }
        .contact {
            max-width: 1400px;
            margin: 70px auto 0;
            padding: 0 30px 50px;
            border-top: 1px solid var(--border);
            padding-top: 50px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 15px;
        }
        .contact a {
            color: var(--accent-hk);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }
        .contact a:hover {
            color: var(--accent-neon);
            text-shadow: var(--glow);
        }
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 12vw;
            }
            .hero p {
                font-size: 4vw;
            }
            .products {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            header {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">URBAN SCENT</div>
    <div class="header-right">
        <select class="lang-select" id="langSelect">
            <option value="zh-HK">繁體</option>
            <option value="zh-CN">简体</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="it">Italiano</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
        </select>
        <div class="cart-icon">🛒 <span id="cartCount">0</span></div>
    </div>
</header>

<section class="hero">
    <div class="hero-text">
        <h1 data-i18n="hero-title">SCENT THE CITY</h1>
        <p data-i18n="hero-sub">氣味無界</p>
    </div>
</section>

<div class="container">
    <h2 class="section-title" data-i18n="products-title">香水系列</h2>
    <div class="products" id="productsList"></div>
</div>

<div class="cart-bar">
    <div class="cart-total">
        <span data-i18n="total">總金額</span>: HKD $<span id="totalPrice">0</span>
    </div>
    <button class="checkout-btn" data-i18n="checkout">立即結賬</button>
</div>

<div class="contact">
    <p>WhatsApp: <a href="https://wa.me/85291257354" target="_blank">+852 9125 7354</a></p>
    <p>Email: <a href="mailto:contact@urbanscent.com">contact@urbanscent.com</a></p>
    <p>&copy; 2026 URBAN SCENT. 香水.</p>
</div>

<script>
    // 👇 呢度净系改呢10款货品就得，其他代码完全唔好动！
    const products = [
        { id: 1, name: "廢墟工廠木質調", price: 499, img: "https://picsum.photos/500/700?random=1" },
        { id: 2, name: "霓虹暗巷煙燻調", price: 469, img: "https://picsum.photos/500/700?random=2" },
        { id: 3, name: "天台雨夜冷調", price: 449, img: "https://picsum.photos/500/700?random=3" },
        { id: 4, name: "塗鴉巷弄柑橘調", price: 429, img: "https://picsum.photos/500/700?random=4" },
        { id: 5, name: "朋克鉚釘皮革調", price: 529, img: "https://picsum.photos/500/700?random=5" },
        { id: 6, name: "舊茶餐廳檀木調", price: 479, img: "https://picsum.photos/500/700?random=6" },
        { id: 7, name: "廢棄碼頭鹹香調", price: 459, img: "https://picsum.photos/500/700?random=7" },
        { id: 8, name: "街頭叛逆烏木調", price: 549, img: "https://picsum.photos/500/700?random=8" },
        { id: 9, name: "午夜巷弄琥珀調", price: 489, img: "https://picsum.photos/500/700?random=9" },
        { id: 10, name: "都市原始生薑調", price: 519, img: "https://picsum.photos/500/700?random=10" }
     ];

    let cart = [];
    const productsEl = document.getElementById('productsList');
    const cartCountEl = document.getElementById('cartCount');
    const totalPriceEl = document.getElementById('totalPrice');

    function renderProducts() {
        productsEl.innerHTML = '';
        products.forEach(p => {
            const productCard = document.createElement('div');
            productCard.className = 'product';
            productCard.innerHTML = `
                <img src="${p.img}" alt="${p.name}" class="product-img">
                <div class="product-info">
                    <div class="product-name">${p.name}</div>
                    <div class="price">$${p.price}</div>
                    <button class="add-cart" onclick="addToCart(${p.id})" data-i18n="add-cart">加入購物車</button>
                </div>
            `;
            productsEl.appendChild(productCard);
        });
        updateI18n();
    }

    window.addToCart = function(id) {
        const item = products.find(p => p.id === id);
        cart.push(item);
        updateCart();
    }

    function updateCart() {
        cartCountEl.textContent = cart.length;
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        totalPriceEl.textContent = total;
    }

    const i18n = {
        "zh-HK": {
            "hero-title": "SCENT THE CITY",
            "hero-sub": "氣味無界",
            "products-title": "香水系列",
            "total": "總金額",
            "checkout": "立即結賬",
            "add-cart": "加入購物車"
        },
        "zh-CN": {
            "hero-title": "SCENT THE CITY",
            "hero-sub": "气味无界",
            "products-title": "香水系列",
            "total": "总金额",
            "checkout": "立即结账",
            "add-cart": "加入购物车"
        },
        "en": {
            "hero-title": "SCENT THE CITY",
            "hero-sub": "URBAN RUIN, UNBOUND SCENT",
            "products-title": "FRAGRANCE COLLECTION",
            "total": "TOTAL",
            "checkout": "CHECKOUT",
            "add-cart": "ADD TO CART"
        },
        "fr": {
            "hero-title": "SCENT THE CITY",
            "hero-sub": "RUIN URBAINE, PARFUM SANS LIMITE",
            "products-title": "COLLECTION PARFUM",
            "total": "TOTAL",
            "checkout": "PAYER",
            "add-cart": "AJOUTER AU PANIER"
        },
        "it": {
            "hero-title": "SCENT THE CITY",
            "hero-sub": "ROVINA URBANA, PROFUMO SENZA LIMITI",
            "products-title": "COLLEZIONE PROFUMI",
            "total": "TOTALE",
            "checkout": "PAGA",
            "add-cart": "AGGIUNGI AL CARRELLO"
        },
        "es": {
            "hero-title": "SCENT THE CITY",
            "hero-sub": "RUINA URBANA, FRAGANCIA SIN LÍMITES",
            "products-title": "COLECCIÓN FRAGANCIAS",
            "total": "TOTAL",
            "checkout": "PAGAR",
            "add-cart": "AÑADIR AL CARRITO"
        },
        "ja": {
            "hero-title": "SCENT THE CITY",
            "hero-sub": "都会の廃墟、限りなき香り",
            "products-title": "フレグランスコレクション",
            "total": "合計",
            "checkout": "レジへ",
            "add-cart": "カートに追加"
        },
        "ko": {
            "hero-title": "SCENT THE CITY",
            "hero-sub": "도시 폐허, 경계 없는 향기",
            "products-title": "향수 컬렉션",
            "total": "총액",
            "checkout": "결제하기",
            "add-cart": "장바구니에 추가"
        }
    };

    function updateI18n() {
        const lang = document.getElementById('langSelect').value;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            el.textContent = i18n[lang][key];
        });
    }

    document.getElementById('langSelect').addEventListener('change', updateI18n);

    renderProducts();
</script>

</body>
</html>
