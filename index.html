<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orphée & Ashworth</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: sans-serif;
}
body {
  background: #fff;
  color: #111;
  padding: 40px 20px 100px;
}

.nav {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 12px;
  font-size: 13px;
  align-items: center;
  z-index: 999;
}
.lang-switch button {
  padding: 3px 6px;
  border: 1px solid #ddd;
  background: #fff;
  border-radius: 3px;
  cursor: pointer;
  font-size: 12px;
}
.nav button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 13px;
}

.logo {
  text-align: center;
  margin-bottom: 50px;
}
.logo img {
  height: 40px;
}

.about {
  text-align: center;
  margin-bottom: 50px;
  line-height: 1.7;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 30px 20px;
  max-width: 900px;
  margin: 0 auto;
}
.product {
  text-align: center;
}
.product img {
  width: 80px;
  height: auto;
  margin-bottom: 10px;
  cursor: pointer;
}
.product-name {
  font-size: 14px;
  margin-bottom: 4px;
}
.product-price {
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}
.btn {
  padding: 6px 10px;
  background: #111;
  color: #fff;
  border: none;
  font-size: 11px;
  cursor: pointer;
  margin: 2px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.96);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-box {
  background: #fff;
  padding: 30px;
  width: 90%;
  max-width: 500px;
  position: relative;
}
.close {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 18px;
  cursor: pointer;
}
.modal-info {
  margin: 16px 0;
  line-height: 1.6;
  font-size: 14px;
}

.whatsapp-float {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #25D366;
  color: #fff;
  padding: 12px 18px;
  border-radius: 50px;
  font-size: 13px;
  cursor: pointer;
  z-index: 998;
}

[lang-zhs],[lang-zh],[lang-en],[lang-fr],[lang-de] { display: none; }
body.zh [lang-zh] { display: block; }
body.zhs [lang-zhs] { display: block; }
body.en [lang-en] { display: block; }
body.fr [lang-fr] { display: block; }
body.de [lang-de] { display: block; }
</style>
</head>

<body class="zh">

<div class="nav">
  <div class="lang-switch">
    <button onclick="setLang('zh')">繁</button>
    <button onclick="setLang('zhs')">简</button>
    <button onclick="setLang('en')">EN</button>
    <button onclick="setLang('fr')">FR</button>
    <button onclick="setLang('de')">DE</button>
  </div>
  <button onclick="openWishlist()">
    <span lang-zh>願望</span><span lang-zhs>愿望</span>
    <span lang-en>Wish</span><span lang-fr>Souhait</span><span lang-de>Wunsch</span>
  </button>
  <button onclick="openCart()">

    <span lang-en>Cart</span><span lang-fr>Panier</span><span lang-de>Warenkorb</span>
    (<span id="cartCount">0</span>)
  </button>
</div>

<div class="logo">
  <img src="https://i.imgur.com/8X7Z1pY.png" alt="Logo">
</div>

<div class="about">

  <p lang-en>Orphée & Ashworth creates refined luxury fragrances.</p>
  <p lang-fr>Orphée & Ashworth crée des parfums de luxe raffinés.</p>
  <p lang-de>Orphée & Ashworth schafft edle Luxusparfüms.</p>
</div>
