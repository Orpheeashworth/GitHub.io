*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;padding:40px 20px 120px;animation:fadeIn 1s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.audio-control{position:fixed;top:15px;left:15px;z-index:999}
.audio-btn{background:#000;color:#fff;border:1px solid #888;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px}

.nav{position:fixed;top:15px;right:15px;display:flex;gap:10px;font-size:12px;z-index:999}
.lang-switch button{padding:3px 6px;border:1px solid #666;background:#000;color:#fff;border-radius:3px}
.nav button{background:none;border:none;color:#fff;cursor:pointer}

.logo{text-align:center;margin-bottom:40px;font-size:32px;font-weight:300;letter-spacing:1px}
.about{text-align:center;margin-bottom:50px;line-height:1.6;font-size:20px}

.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 20px;max-width:900px;margin:0 auto}
.product{text-align:center}

.perfume-bottle {
  position: relative;
  width: 70px;
  height: 100px;
  margin: 0 auto 10px;
  animation: spin 16s infinite linear;
  cursor: pointer;
}
@keyframes spin {
  0%{transform:rotateY(0deg)}
  100%{transform:rotateY(360deg)}
}

.bottle-top {
  width: 20px;
  height: 22px;
  background: #ddd;
  margin: 0 auto;
  border-radius: 2px;
}
.bottle-neck {
  width: 16px;
  height: 12px;
  background: rgba(255,255,255,0.2);
  margin: 0 auto;
}
.bottle-body {
  width: 50px;
  height: 65px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px 8px 20px 20px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}
.bottle-label {

  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: 7px;
  color: #fff;
  font-weight: bold;
  white-space: nowrap;
}

.product-name{font-size:13px;margin-bottom:4px}
.product-price{font-size:13px;color:#aaa;margin-bottom:8px}
.btn{padding:6px 10px;background:#fff;color:#000;border:none;font-size:11px;cursor:pointer;margin:2px;border-radius:4px;transition:0.2s}
.btn:hover{transform:scale(1.08);background:#ddd}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:1000;align-items:center;justify-content:center}
.modal-box{background:#111;padding:30px;width:90%;max-width:500px;position:relative;border:1px solid #333;border-radius:8px}
.close{position:absolute;top:15px;right:15px;font-size:24px;cursor-pointer;color:#fff}
.desc{margin-top:10px;line-height:1.6;font-size:14px;color:#ccc}

.whatsapp-float{position:fixed;bottom:30px;right:30px;background:#25D366;color:#fff;padding:12px 20px;border-radius:50px;font-size:14px;cursor:pointer;transition:0.2s}
.whatsapp-float:hover{transform:scale(1.08)}

.footer{text-align:center;margin-top:60px;font-size:12px;color:#999;line-height:1.8}

[lang-zh],[lang-zhs],[lang-en],[lang-fr],[lang-de]{display:none}
body.zh [lang-zh]{display:block}
body.zhs [lang-zhs]{display:block}
body.en [lang-en]{display:block}
body.fr [lang-fr]{display:block}
body.de [lang-de]{display:block}

<script>
let cart = [];
let wishlist = [];
let audio = document.getElementById('waterSound');
let isPlaying = false;

function toggleSound() {
  if (!isPlaying) {
    audio.volume = 0.3;
    audio.play();
    isPlaying = true;
  } else {
    audio.pause();
    isPlaying = false;
  }
}

function setLang(lang) {
  document.body.className = lang;
}
function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
function showDetail(name, note, desc) {
  document.getElementById('detailTitle').innerText = name + '｜' + note;
  document.getElementById('detailDesc').innerText = desc;
  document.getElementById('modal').style.display = 'flex';
}
function addToCart(name, price) {
  cart.push({ name, price });
  document.getElementById('cartCount').innerText = cart.length;
  alert(name + ' 已加入購物車');
}
function addToWish(name) {
  wishlist.push(name);
  alert(name + ' 已加入願望清單');
}
function openCart() {
  let html = '<h4>購物車</h4>';
  let total = 0;
  cart.forEach(item => {
    html += `<p>${item.name} HK$${item.price}</p>`;
    total += item.price;
  });
  html += `<p><br>總額 HK$${total}</p>`;
  document.getElementById('detailTitle').innerText = '';
  document.getElementById('detailDesc').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}
function openWishlist() {
  let html = '<h4>願望清單</h4>';
  wishlist.forEach(item => {
    html += `<p>${item}</p>`;
  });
  document.getElementById('detailTitle').innerText = '';
  document.getElementById('detailDesc').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}
</script>
