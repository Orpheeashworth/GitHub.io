<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orphee & Ashworth</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff;color:#222;padding-bottom:30px}
header{padding:20px;border-bottom:1px solid #eee}
.logo{font-size:22px;font-weight:700}
.hero{height:280px;background:#f3f3f3;display:flex;align-items:center;justify-content:center;color:#222}
.hero-inner{text-align:center}
.hero h1{font-size:28px;margin-bottom:10px}
.container{padding:20px}
.section-title{font-size:20px;margin:20px 0;text-align:center}
.products{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.product{border:1px solid #eee;border-radius:8px;overflow:hidden}
.product-img{height:160px;background:#eee}
.product-info{padding:12px}
.product-name{font-size:15px;margin-bottom:6px}
.product-price{font-size:14px;color:#666;margin-bottom:10px}
.btn{background:#000;color:#fff;padding:8px 0;text-align:center;border-radius:4px;font-size:13px}
.contact{margin-top:30px;padding:20px;background:#f9f9f9;border-radius:8px;text-align:center}
.contact p{margin:6px 0}
</style>
</head>
<body>
<header>
<div class="logo">Orphee & Ashworth</div>
</header>
<div class="hero">
<div class="hero-inner">
<h1>奢華香氛體驗</h1>
<p>來自香港的高級香水品牌</p>
</div>
</div>
<div class="container">
<div class="section-title">精選產品</div>
<div class="products">
<div class="product">
<div class="product-img"></div>
<div class="product-info">
<div class="product-name">Orphee EDP</div>
<div class="product-price">HK$1,480</div>
<div class="btn">加入查詢</div>
</div>
</div>
<div class="product">
<div class="product-img"></div>
<div class="product-info">
<div class="product-name">Ashworth Woody</div>
<div class="product-price">HK$1,520</div>
<div class="btn">加入查詢</div>
</div>
</div>
<div class="product">
<div class="product-img"></div>
<div class="product-info">
<div class="product-name">Floral Essence</div>
<div class="product-price">HK$1,390</div>
<div class="btn">加入查詢</div>
</div>
</div>
<div class="product">
<div class="product-img"></div>
<div class="product-info">
<div class="product-name">Oud Signature</div>
<div class="product-price">HK$1,680</div>
<div class="btn">加入查詢</div>
</div>
</div>
</div>
<div class="contact">
<p>付款方式：Visa、Mastercard、支付寶、微信支付</p>
<p>WhatsApp：9047 5370</p>
</div>
</div>
</body>
</html>
