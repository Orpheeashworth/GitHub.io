* {

}
:root {
    --bg-main: #0a0a0d;
    --bg-card: #14141a;
    --accent-neon: #ff3a3a;
    --accent-hk: #ff6b00;
    --text-primary: #f0f0f0;
    --text-secondary: #a0a0a8;
    --border: #2a2a33;
    --glow: 0 0 15px rgba(255, 58, 58, 0.4);
}
body {

    color: var(--text-primary);
    line-height: 1.5;
    padding-bottom: 120px;
}
/* 首页轮播背景（自动切换，图片100%加载） */
.hero {

    height: 80vh;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
.hero-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    background-size: cover;
    background-position: center;
}
.hero-slide.active {
    opacity: 1;
}
.hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30%;
    background: linear-gradient(transparent, var(--bg-main));
    z-index: 1;
}
.hero-text {
    position: relative;
    z-index: 2;
}
.hero h1 {
    font-size: 7vw;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -3px;
    margin-bottom: 15px;
    line-height: 1;
    text-shadow: 0 0 20px rgba(255, 107, 0, 0.6);
}
.hero p {
    font-size: 1.8vw;
    text-transform: uppercase;
    letter-spacing: 4px;
    opacity: 0.9;
    color: var(--accent-hk);
}
/* 头部导航 */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 30px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(10,10,13,0.95);
    backdrop-filter: blur(8px);
    z-index: 999;
}
.logo {
    font-size: 3.5rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-primary);
    text-shadow: var(--glow);
    line-height: 1.2;
}
.header-right {
    display: flex;
    align-items: center;
    gap: 25px;
}
.lang-select {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 0;
    text-transform: uppercase;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
}
.lang-select:hover {
    border-color: var(--accent-neon);
    box-shadow: var(--glow);
}
.cart-icon {
    font-size: 2.5rem;
    cursor: pointer;
    position: relative;
    transition: transform 0.2s;
}
.cart-icon:hover {
    transform: scale(1.1);
}
#cartCount {
    position: absolute;
    top: -8px;
    right: -8px;
    background: var(--accent-neon);
    color: #fff;
    font-size: 1rem;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    box-shadow: var(--glow);
}
/* 分类按钮（还原红框高亮） */
.filter-wrap {
    max-width: 1400px;
    margin: 30px auto 0;
    padding: 0 30px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    justify-items: center;
}
.filter-btn {
    padding: 16px 32px;
    background: transparent;
    border: 2px solid var(--accent-neon);
    color: var(--text-primary);
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 1px;
    min-width: 200px;
    text-align: center;
    outline: none;
}
.filter-btn.active {
    background: var(--accent-neon);
    color: #000;
    box-shadow: var(--glow);
}
.filter-btn:hover {
    box-shadow: var(--glow);
}
/* 产品区域 */
.container {
    max-width: 1400px;
    margin: 40px auto;
    padding: 0 30px;
}
.section-title {
    font-size: 3rem;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    letter-spacing: 1px;
}
.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 35px;
}
.product {
    background: var(--bg-card);
    border: 1px solid var(--border);
    transition: all 0.4s ease;
    overflow: hidden;
    position: relative;
}
.product:hover {

    box-shadow: 0 10px 30px rgba(255, 58, 58, 0.2);
}
.product-img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    background: #1a1a1a;
    filter: grayscale(30%) contrast(1.2);
    transition: filter 0.4s;
}
.product:hover .product-img {
    filter: grayscale(0%) contrast(1.1);
}
.product-info {
    padding: 20px;
}
.product-name {
    font-size: 1.5rem;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 15px;
    letter-spacing: 0.8px;
}
.price {
    font-size: 2rem;
    font-weight: 900;
    color: var(--accent-neon);
    margin-bottom: 20px;
}
.add-cart {

    color: var(--text-primary);

    font-weight: 900;
    text-transform: uppercase;
    font-size: 1.1rem;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 0;
}
.add-cart:hover {
    background: var(--accent-neon);
    color: var(--bg-main);
    box-shadow: var(--glow);
}
/* 支付图标（100%加载） */
.payment-section {
    max-width: 1400px;
    margin: 50px auto 0;
    padding: 0 30px;
    text-align: center;
}
.payment-icons {
    display: flex !important;
    justify-content: center !important;
    gap: 30px !important;
    flex-wrap: wrap !important;
    align-items: center !important;
}
.payment-icon {
    height: 48px !important;
    width: auto !important;
    object-fit: contain !important;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
}
/* 底部购物车栏 */
.cart-bar {

    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(20,20,26,0.95);

// 渲染产品
function renderProducts() {
    productsEl.innerHTML = '';
    const filteredProducts = currentFilter === "all" ? products : products.filter(p => p.cat === currentFilter);
    const currentLang = langSelectEl.value;
    
    filteredProducts.forEach(p => {
        const productCard = document.createElement('div');
        productCard.className = 'product';
        productCard.innerHTML = `
            <img src="${p.img}" alt="${p.name}" class="product-img">
            <div class="product-info">
                <div class="product-name">${p.name}</div>
                <div class="price">$${p.price}</div>
                <button class="add-cart" onclick="addToCart(${p.id})" data-i18n="add-cart">${i18n[currentLang]["add-cart"]}</button>
            </div>
        `;
        productsEl.appendChild(productCard);
    });
    updateI18n();
}

// 购物车功能
window.addToCart = function(id) {
    const item = products.find(p => p.id === id);
    if (!item) return;
    cart.push(item);
    updateCart();
};

function updateCart() {
    cartCountEl.textContent = cart.length;
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    totalPriceEl.textContent = total;
}

// 语言更新
function updateI18n() {
    const currentLang = langSelectEl.value;
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = i18n[currentLang][key];
    });
}

// 分类切换
document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderProducts();
    });
});

// WhatsApp结账
window.sendWhatsAppOrder = function() {
    const currentLang = langSelectEl.value;
    if (cart.length === 0) {
        alert(i18n[currentLang]["empty-cart"]);
        return;
    }
    let msg = `${i18n[currentLang]["checkout"]}:\n`;
    cart.forEach((item, index) => {
        msg += `${index + 1}. ${item.name} | HKD $${item.price}\n`;
    });
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    msg += `\n${i18n[currentLang]["total"]}: HKD $${total}`;
    window.open(`https://wa.me/85291257354?text=${encodeURIComponent(msg)}`);
};

// 首页轮播（自动切换，5秒一张）
const slides = document.querySelectorAll('.hero-slide');
let currentSlide = 0;
setInterval(() => {
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add('active');
}, 5000);

// 语言切换事件
langSelectEl.addEventListener('change', () => {
    updateI18n();
    renderProducts();
});

// 初始化页面
renderProducts();
updateCart();
updateI18n();
</script>
