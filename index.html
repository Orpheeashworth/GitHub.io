<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCENT THE CITY 代购宣传海报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', 'PingFang SC', 'Microsoft JhengHei', sans-serif;
        }

        .poster {
            position: relative;
            width: 1280px;
            height: 800px;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1514565131-fce0801e5785?ixlib=rb-4.0.3&auto=format&fit=crop&w=1280&q=80') center/cover no-repeat;
            color: #fff;
            overflow: hidden;
        }

        /* 主标题 */
        .main-title {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 170, 100, 0.8);
            z-index: 10;
        }

        /* 副标题 */
        .sub-title {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            color: #ff9966;
            letter-spacing: 2px;
            z-index: 10;
        }

        /* 产品香水瓶 */
        .product-container {
            position: absolute;
            bottom: 120px;
            left: 150px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .perfume-bottle {
            width: 120px;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5));
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .product-name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .product-price {
            font-size: 18px;
            color: #ff9966;
        }

        /* 购物车按钮 */
        .cart-btn {
            position: absolute;
            bottom: 80px;
            right: 100px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .cart-btn:hover {
            background: rgba(255, 170, 100, 0.3);
            transform: scale(1.05);
        }

        /* WhatsApp 按钮 */
        .whatsapp-btn {
            position: absolute;
            bottom: 80px;
            left: 100px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #25D366;
            padding: 12px 20px;
            border-radius: 50px;
            color: #fff;
            font-size: 18px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .whatsapp-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
        }

        /* 底部代购文字 */
        .footer-text {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="main-title">SCENT THE CITY</div>
        <div class="sub-title">氣味無界</div>

        <!-- 产品展示区 -->
        <div class="product-container">
            <!-- 这里用示例香水瓶图片，你可以替换成自己的产品图 -->
            <img class="perfume-bottle" src="https://cdn-icons-png.flaticon.com/512/1697/1697488.png" alt="Perfume Bottle">
            <div class="product-info">
                <div class="product-name">经典城市淡香水</div>
                <div class="product-price">HKD $680</div>
            </div>
        </div>

        <!-- 购物车按钮 -->
        <div class="cart-btn">
            <span class="cart-icon">🛒</span>
            <span>立即选购</span>
        </div>

        <!-- WhatsApp 按钮 -->
        <a href="https://wa.me/你的WhatsApp号码" class="whatsapp-btn" target="_blank">
            <span class="whatsapp-icon">💬</span>
            <span>WhatsApp咨询</span>
        </a>

        <div class="footer-text">✈️ 海外直采 · 正品代购</div>
    </div>
</body>
</html>
